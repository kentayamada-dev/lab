syntax = "proto3";
package todo.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "todo/v1/rules.proto";

// A single todo item.
message Todo {
  // Unique identifier assigned by the database.
  int64 id = 1;
  // Human readable description of what has to be done.
  string title = 2;
  // Whether the item has been completed.
  bool done = 3;
  // When the item was created, assigned by the database.
  google.protobuf.Timestamp created_at = 4;
}

// Request to create a new todo.
message CreateTodoRequest {
  // Title of the todo to create. Leading and trailing whitespace is trimmed
  // before storage, and todo_title applies to the trimmed value.
  string title = 1 [(buf.validate.field).string.(todo.v1.todo_title) = true];
}

// Response containing the newly created todo.
message CreateTodoResponse {
  // The stored todo, including its assigned id.
  Todo todo = 1;
}

// Request to list one page of todos.
message ListTodosRequest {
  // How many todos to return at most. Zero asks for the server's default of
  // 50.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // Opaque token taken from the previous response's next_page_token. Empty
  // starts at the first page. Clients must not build one themselves.
  string page_token = 2 [(buf.validate.field).cel = {
    id: "page_token.format"
    message: "page_token is not a valid token"
    // A token spells a todo id, so it has to fit in an int64. Only a token of
    // 19 digits can overflow that range, and decimal strings of equal length
    // order the same way as the numbers they spell, so comparing it against
    // the maximum as a string settles it.
    expression:
      "this == '' || (this.matches('^[1-9][0-9]{0,18}$') "
      "&& (this.size() < 19 || this <= '9223372036854775807'))"
  }];
}

// Response containing one page of todos.
message ListTodosResponse {
  // The todos on this page, ordered by id. Empty when the page has none.
  repeated Todo todos = 1;
  // Token that fetches the next page. Empty on the last page.
  string next_page_token = 2;
}

// Request to update an existing todo.
message UpdateTodoRequest {
  option (buf.validate.message).cel = {
    id: "update.no_fields"
    message: "at least one of done or title must be present"
    expression: "has(this.done) || has(this.title)"
  };

  // Identifier of the todo to update. Ids are assigned from 1 up, so a
  // smaller value cannot identify a todo.
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  // Desired completion state. Left unchanged when absent.
  optional bool done = 2;
  // New title for the todo. Left unchanged when absent. Trimmed and validated
  // the same way as CreateTodoRequest.title.
  optional string title = 3 [(buf.validate.field).string.(todo.v1.todo_title) = true];
}

// Response containing the updated todo.
message UpdateTodoResponse {
  // The todo after the update was applied.
  Todo todo = 1;
}

// Request to delete an existing todo.
message DeleteTodoRequest {
  // Identifier of the todo to delete. Ids are assigned from 1 up, so a
  // smaller value cannot identify a todo.
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

// Response to a deletion. It carries no data.
message DeleteTodoResponse {}

// Operations on todo items. Every procedure works on the todos of the account
// named by the request's bearer token (auth/v1/auth.proto) and fails with the
// unauthenticated code without a valid one.
service TodoService {
  // Creates a new todo item from the given title and returns the stored
  // record. Fails with the invalid_argument code when the title breaks the
  // rules declared on CreateTodoRequest.title.
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse);

  // Returns one page of the account's todo items ordered by id. The response
  // carries a next_page_token whenever a further page exists; passing it back
  // walks the rest. Fails with the invalid_argument code when page_size is outside its
  // range or page_token was not taken from a previous response.
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse);

  // Updates the todo identified by id and returns the updated record: done and
  // title are each applied only when present. Fails with the not_found code
  // when the account has no todo with that id, and with the invalid_argument
  // code when id is not positive, the request carries neither field, or the
  // title breaks its rules.
  rpc UpdateTodo(UpdateTodoRequest) returns (UpdateTodoResponse);

  // Deletes the todo identified by id. Fails with the not_found code when the
  // account has no todo with that id, and with the invalid_argument code when
  // id is not positive.
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse);
}
