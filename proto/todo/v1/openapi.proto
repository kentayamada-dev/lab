syntax = "proto3";
package todo.v1;

import "gnostic/openapi/v3/annotations.proto";

// The identity of the generated OpenAPI document, which the plugin otherwise
// leaves empty once every proto file is collected into a single document. It
// lives in its own file so the descriptor the web client imports stays free of
// the gnostic dependency.
option (gnostic.openapi.v3.document) = {
  info: {
    title: "Todo API"
    // The API surface this document describes, so it moves with the package
    // version rather than on its own release schedule.
    version: "v1"
  }
  // Where Swagger UI's "Try it out" sends the requests. Without it the page
  // falls back to the origin it is served from, which is the docs container
  // rather than the api (docker-compose.yml). The document is a build artifact
  // and cannot read the environment, so the port is a server variable holding
  // .env.example's API_PORT (README.md#起動).
  servers: [
    {
      url: "http://localhost:{port}"
      variables: {
        additional_properties: [
          {
            name: "port"
            value: {default: "8080"}
          }
        ]
      }
    }
  ]
  components: {
    security_schemes: {
      additional_properties: [
        {
          name: "bearerAuth"
          value: {
            security_scheme: {
              type: "http"
              scheme: "bearer"
              bearer_format: "JWT"
              description: "Token issued by AuthService (auth/v1/auth.proto)."
            }
          }
        }
      ]
    }
  }
  // Required by every operation, which is what puts the Authorize button on
  // the docs page and makes it send the header. It overstates the two
  // AuthService procedures, which issue a token rather than need one and
  // ignore the header; naming the requirement per operation instead would mean
  // annotating the service files, which openapi.proto exists to avoid.
  security: [
    {
      additional_properties: [
        {
          name: "bearerAuth"
          value: {}
        }
      ]
    }
  ]
};
