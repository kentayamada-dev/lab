name: lab

x-env:
  app_db_url: &app_db_url "postgres://${DB_USER:?}:${DB_PASSWORD:?}@db:${DB_PORT:?}/${DB_NAME:?}?${DB_OPTS:?}&application_name=app"
  atlas_db_url: &atlas_db_url "postgres://${DB_USER:?}:${DB_PASSWORD:?}@db:${DB_PORT:?}/${ATLAS_DEV_DB:?}?${DB_OPTS:?}&application_name=atlas"
  # Who the containers run as. A macOS host needs no override, since Docker
  # Desktop shows the bind mount as owned by whoever runs in the container; CI
  # runs on Linux, where it does not, and sets these to the runner's own ids so
  # the checkout stays writable (docs/ci-jobs.md).
  uid: &uid "${USER_UID:-1000}"
  gid: &gid "${USER_GID:-1000}"
  user: &tool_user "${USER_UID:-1000}:${USER_GID:-1000}"
  user_name: &user_name "dev"

services:
  api:
    hostname: api
    container_name: api
    init: true
    build:
      context: .devcontainer
      dockerfile: api-container/Dockerfile
      target: "${API_BUILD_TARGET:-dev}"
      args:
        USER_UID: *uid
        USER_GID: *gid
        USER_NAME: *user_name
    ports:
      - "127.0.0.1:${API_PORT:?}:${API_PORT:?}"
    environment:
      PORT: "${API_PORT:?}"
      DB_URL: *app_db_url
      # The docs service serves the Swagger UI page from its own port, so the
      # requests that page sends are cross-origin (api/internal/server/cors.go).
      CORS_ORIGINS: "http://localhost:${DOCS_PORT:?}"
    volumes:
      - .:/workspace
      - "${GO_MOD_CACHE:-go_mod_cache}:/go/pkg/mod"
      - "${GO_BUILD_CACHE:-go_build_cache}:/go/cache"
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  web:
    hostname: web
    container_name: web
    init: true
    build:
      context: .devcontainer
      dockerfile: web-container/Dockerfile
      args:
        USER_UID: *uid
        USER_GID: *gid
        USER_NAME: *user_name
    ports:
      - "127.0.0.1:${WEB_PORT:?}:${WEB_PORT:?}"
    environment:
      NEXT_TELEMETRY_DISABLED: 1
      PORT: "${WEB_PORT:?}"
      API_PORT: "${API_PORT:?}"
    volumes:
      - .:/workspace
      - node_modules:/workspace/web/node_modules
      - "${PNPM_STORE:-pnpm_store}:/pnpm/store"
    command: sleep infinity

  docs:
    hostname: docs
    container_name: docs
    image: swaggerapi/swagger-ui:v5.32.15@sha256:9ae209e3791e6fa78e1426769bf54562a043caa969287bfd3779428ece4930e5
    # The image's nginx listens on 8080, which the PORT variable would change.
    ports:
      - "127.0.0.1:${DOCS_PORT:?}:8080"
    environment:
      # Fetched by the browser rather than by this container, so the document
      # the page shows is the one the running api serves
      # (api/internal/server/openapi.go), and the servers entry it carries
      # points "Try it out" back at the api (proto/todo/v1/openapi.proto).
      SWAGGER_JSON_URL: "http://localhost:${API_PORT:?}/openapi.yaml"

  buf:
    profiles:
      - tools
    image: bufbuild/buf:1.72@sha256:65bd496a89c762ad7151ca9e7d885a45dacb3671a8e8ec39738b9f844d3405ea
    user: *tool_user
    working_dir: /workspace
    environment:
      HOME: /tmp
    volumes:
      - .:/workspace

  db:
    hostname: db
    container_name: db
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    ports:
      - "127.0.0.1:${DB_PORT:?}:${DB_PORT:?}"
    environment:
      PGPORT: "${DB_PORT:?}"
      POSTGRES_DB: postgres
      POSTGRES_USER: "${DB_USER:?}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?}"
      DB_NAME: "${DB_NAME:?}"
      ATLAS_DEV_DB: "${ATLAS_DEV_DB:?}"
    volumes:
      - db_data:/var/lib/postgresql
      - ./.devcontainer/db-container/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:?} -d ${DB_NAME:?} -p ${DB_PORT:?}" ]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s

  atlas:
    profiles:
      - tools
    image: arigaio/atlas:1.3.3-community-alpine@sha256:9d3161bf3bf2b0ce6d0f6b63471d0a341e664e87cccec90a12139ea2cba18575
    user: *tool_user
    working_dir: /workspace/db
    environment:
      HOME: /tmp
      DB_URL: *app_db_url
      ATLAS_DB_URL: *atlas_db_url
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy

  db_gui:
    hostname: db_gui
    container_name: db_gui
    image: dbeaver/cloudbeaver:26.2.0@sha256:c06c1859700bd9202d9d49ebc10ee2512d745997d05e7ca6423267b227af1ca7
    ports:
      - "127.0.0.1:8978:8978"
    environment:
      DB_HOST: db
      DB_PORT: "${DB_PORT:?}"
      DB_NAME: "${DB_NAME:?}"
      DB_USER: "${DB_USER:?}"
      DB_PASSWORD: "${DB_PASSWORD:?}"
      CB_SERVER_NAME: db_gui
      CB_ADMIN_NAME: CBAdmin
      CB_ADMIN_PASSWORD: Password1
      CLOUDBEAVER_SYSTEM_VARIABLES_RESOLVING_ENABLED: "true"
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
    volumes:
      - db_gui_data:/opt/cloudbeaver/workspace
      - ./.devcontainer/db_gui-container/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  go_mod_cache:
  go_build_cache:
  node_modules:
  pnpm_store:
  db_data:
  db_gui_data:
