---
# devcontainer が使うコンテナの定義。.devcontainer/<名前>/devcontainer.json が dockerComposeFile として
# このファイルを指し、service でどのコンテナに入るかを選ぶ。1つの compose ファイルを複数の
# devcontainer.json で共有する形は、VS Code が複数コンテナ構成として案内しているものに合わせている。
# https://code.visualstudio.com/remote/advancedcontainers/connect-multiple-containers
services:
  api:
    # 指定しないと Docker はコンテナ ID の先頭12桁をホスト名にする。シェルのプロンプトに出る名前が
    # 作り直すたびに変わってしまうため、サービス名と同じ固定の名前を与える
    hostname: api

    build:
      # Dockerfile はこのディレクトリの既定名のものを使う。ユーザー名と UID/GID は Dockerfile の ARG の
      # 既定値をそのまま使い、args でここから渡し直さない（同じ値を2箇所で持たないため）
      context: .devcontainer/api-container

    # devcontainer.json の workspaceFolder が /workspace/api を指すため、リポジトリ全体を /workspace に置く。
    # api/ だけをマウントすると、コンテナの中からリポジトリ直下の設定ファイルが見えなくなる
    volumes:
      - .:/workspace

    # compose 構成の devcontainer は overrideCommand の既定が false で、golang イメージの既定 command はすぐ終わるため待機させる。
    # https://containers.dev/implementors/json_reference/
    command: sleep infinity

  # 各設定の理由は api と同じ。node イメージの既定 command（node）も TTY が無いとすぐ終わる
  web:
    hostname: web
    build:
      context: .devcontainer/web-container
    volumes:
      - .:/workspace
      # コンテナを作り直してもダウンロード済みのパッケージを残す。パスは web-container の Dockerfile で設定した storeDir と揃える
      - pnpm-store:/home/dev/.local/share/pnpm/store
      # バインドマウント上より install やファイル走査が速い。中身は linux 向けのバイナリでホストでは使えないため、ホストと共有しない
      - web-node-modules:/workspace/web/node_modules
    environment:
      # next dev / build が利用状況を送らないようにする。https://nextjs.org/telemetry
      NEXT_TELEMETRY_DISABLED: "1"
    command: sleep infinity

volumes:
  pnpm-store:
  web-node-modules:
