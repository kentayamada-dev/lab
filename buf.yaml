version: v2
modules:
  - path: proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
    - COMMENTS
breaking:
  use:
    - FILE
  except:
    # go_package no longer lives in the proto files: buf.gen.yaml's managed
    # mode injects it at generation time, so the option is absent from the
    # built image this rule inspects.
    - FILE_SAME_GO_PACKAGE
  # Temporary: UpdateTodoRequest.done became optional (explicit presence),
  # which is wire compatible but changes the generated code. Remove this
  # block in the PR after that change lands on main.
  ignore_only:
    FIELD_SAME_CARDINALITY:
      - proto/todo/v1/todo.proto
