openapi: 3.1.0
info:
  title: todo.v1
paths:
  /todo.v1.TodoService/CreateTodo:
    post:
      tags:
        - todo.v1.TodoService
      summary: CreateTodo
      description: |-
        Creates a new todo item from the given title and returns the stored
         record. Fails with the invalid_argument code when the title breaks the
         rules declared on CreateTodoRequest.title.
      operationId: todo.v1.TodoService.CreateTodo
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/todo.v1.CreateTodoRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/todo.v1.CreateTodoResponse'
  /todo.v1.TodoService/DeleteTodo:
    post:
      tags:
        - todo.v1.TodoService
      summary: DeleteTodo
      description: |-
        Deletes the todo identified by id. Fails with the not_found code when no
         todo has that id.
      operationId: todo.v1.TodoService.DeleteTodo
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/todo.v1.DeleteTodoRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/todo.v1.DeleteTodoResponse'
  /todo.v1.TodoService/ListTodos:
    post:
      tags:
        - todo.v1.TodoService
      summary: ListTodos
      description: Returns all todo items. The list is empty when no todos exist.
      operationId: todo.v1.TodoService.ListTodos
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/todo.v1.ListTodosRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/todo.v1.ListTodosResponse'
  /todo.v1.TodoService/UpdateTodo:
    post:
      tags:
        - todo.v1.TodoService
      summary: UpdateTodo
      description: |-
        Updates the todo identified by id and returns the updated record: done and
         title are each applied only when present, so a request carrying neither
         returns the record unchanged. Fails with the not_found code when no todo
         has that id, and with the invalid_argument code when the title is present
         but breaks its rules.
      operationId: todo.v1.TodoService.UpdateTodo
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/todo.v1.UpdateTodoRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/todo.v1.UpdateTodoResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    todo.v1.CreateTodoRequest:
      type: object
      properties:
        title:
          type: string
          title: title
          description: |
            Title of the todo to create. Leading and trailing whitespace is trimmed
             before storage, and the rules below apply to the trimmed value.
            title.max_len // title must be at most 1000 characters
            title.not_blank // title must not be blank
      title: CreateTodoRequest
      additionalProperties: false
      description: Request to create a new todo.
    todo.v1.CreateTodoResponse:
      type: object
      properties:
        todo:
          title: todo
          description: The stored todo, including its assigned id.
          $ref: '#/components/schemas/todo.v1.Todo'
      title: CreateTodoResponse
      additionalProperties: false
      description: Response containing the newly created todo.
    todo.v1.DeleteTodoRequest:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
          description: Identifier of the todo to delete.
      title: DeleteTodoRequest
      additionalProperties: false
      description: Request to delete an existing todo.
    todo.v1.DeleteTodoResponse:
      type: object
      title: DeleteTodoResponse
      additionalProperties: false
      description: Response to a deletion. It carries no data.
    todo.v1.ListTodosRequest:
      type: object
      title: ListTodosRequest
      additionalProperties: false
      description: Request to list todos. It takes no parameters.
    todo.v1.ListTodosResponse:
      type: object
      properties:
        todos:
          type: array
          items:
            $ref: '#/components/schemas/todo.v1.Todo'
          title: todos
          description: All todos. Empty when none exist.
      title: ListTodosResponse
      additionalProperties: false
      description: Response containing every todo.
    todo.v1.Todo:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
          description: Unique identifier assigned by the database.
        title:
          type: string
          title: title
          description: Human readable description of what has to be done.
        done:
          type: boolean
          title: done
          description: Whether the item has been completed.
        createdAt:
          title: created_at
          description: When the item was created, assigned by the database.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Todo
      additionalProperties: false
      description: A single todo item.
    todo.v1.UpdateTodoRequest:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
          description: Identifier of the todo to update.
        done:
          type:
            - boolean
            - "null"
          title: done
          description: Desired completion state. Left unchanged when absent.
        title:
          type:
            - string
            - "null"
          title: title
          description: |
            New title for the todo. Left unchanged when absent. Subject to the same
             rules as CreateTodoRequest.title.
            title.max_len // title must be at most 1000 characters
            title.not_blank // title must not be blank
      title: UpdateTodoRequest
      additionalProperties: false
      description: Request to update an existing todo.
    todo.v1.UpdateTodoResponse:
      type: object
      properties:
        todo:
          title: todo
          description: The todo after the update was applied.
          $ref: '#/components/schemas/todo.v1.Todo'
      title: UpdateTodoResponse
      additionalProperties: false
      description: Response containing the updated todo.
security: []
tags:
  - name: todo.v1.TodoService
    description: Operations on todo items.
