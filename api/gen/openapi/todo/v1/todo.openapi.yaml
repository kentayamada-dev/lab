openapi: 3.1.0
info:
  title: Todo API
  version: v1
servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "8080"
paths:
  /account.v1.AccountService/DeleteAccount:
    post:
      tags:
        - account.v1.AccountService
      summary: |-
        Closes the account the request is authenticated as, ends every session it
         has, and reports when the data behind it is erased. Fails with the
         unauthenticated code when the password does not match, which is the same
         answer a request carrying no usable token gets.
      description: |-
        The sessions go immediately, this one included: a closed account is one
         nothing can be done with, and leaving the browser signed in to it would
         say otherwise. Logging back in is refused as well, so the grace period is
         for an operator restoring the account, not for the person changing their
         mind through the app.
      operationId: account.v1.AccountService.DeleteAccount
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/account.v1.DeleteAccountRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account.v1.DeleteAccountResponse'
  /auth.v1.AuthService/LogIn:
    post:
      tags:
        - auth.v1.AuthService
      summary: LogIn
      description: |-
        Returns a token for an existing account. Fails with the unauthenticated
         code when the address is unknown or the password does not match: the two
         are answered identically, so the API does not say which addresses have an
         account.
      operationId: auth.v1.AuthService.LogIn
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.LogInRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.LogInResponse'
  /auth.v1.AuthService/LogOut:
    post:
      tags:
        - auth.v1.AuthService
      summary: LogOut
      description: |-
        Ends the session the request carries and expires the session cookie. A
         script cannot delete an HttpOnly cookie, so logging out of the browser app
         is something only the server can do. The token stays signed and unexpired
         either way, so what stops it working is the session it names being gone: a
         client that kept a copy of the token is logged out with the browser. Other
         sessions of the same account are left open. Reaching it needs no token,
         and one that cannot be read is answered as a success rather than refused,
         so it says nothing about whether a token is good.
      operationId: auth.v1.AuthService.LogOut
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.LogOutRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.LogOutResponse'
  /auth.v1.AuthService/SignUp:
    post:
      tags:
        - auth.v1.AuthService
      summary: SignUp
      description: |-
        Creates an account and returns a token for it. Fails with the
         already_exists code when the address is taken, and with the
         invalid_argument code when the credentials break the rules declared on
         SignUpRequest.
      operationId: auth.v1.AuthService.SignUp
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.SignUpRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.SignUpResponse'
  /todo.v1.TodoService/CreateTodo:
    post:
      tags:
        - todo.v1.TodoService
      summary: CreateTodo
      description: |-
        Creates a new todo item from the given title and returns the stored
         record. Fails with the invalid_argument code when the title breaks the
         rules declared on CreateTodoRequest.title.
      operationId: todo.v1.TodoService.CreateTodo
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/todo.v1.CreateTodoRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/todo.v1.CreateTodoResponse'
  /todo.v1.TodoService/DeleteTodo:
    post:
      tags:
        - todo.v1.TodoService
      summary: DeleteTodo
      description: |-
        Deletes the todo identified by id. Fails with the not_found code when the
         account has no todo with that id, and with the invalid_argument code when
         id is not positive.
      operationId: todo.v1.TodoService.DeleteTodo
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/todo.v1.DeleteTodoRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/todo.v1.DeleteTodoResponse'
  /todo.v1.TodoService/ListTodos:
    post:
      tags:
        - todo.v1.TodoService
      summary: ListTodos
      description: |-
        Returns one page of the account's todo items ordered by id. The response
         carries a next_page_token whenever a further page exists; passing it back
         walks the rest. Fails with the invalid_argument code when page_size is outside its
         range or page_token was not taken from a previous response.
      operationId: todo.v1.TodoService.ListTodos
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/todo.v1.ListTodosRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/todo.v1.ListTodosResponse'
  /todo.v1.TodoService/UpdateTodo:
    post:
      tags:
        - todo.v1.TodoService
      summary: UpdateTodo
      description: |-
        Updates the todo identified by id and returns the updated record: done and
         title are each applied only when present. Fails with the not_found code
         when the account has no todo with that id, and with the invalid_argument
         code when id is not positive, the request carries neither field, or the
         title breaks its rules.
      operationId: todo.v1.TodoService.UpdateTodo
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/todo.v1.UpdateTodoRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/todo.v1.UpdateTodoResponse'
components:
  schemas:
    account.v1.DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          title: password
          description: |
            Password of the account being closed. The session alone would be enough to
             reach this procedure, which is exactly why it is not enough to run it: the
             account cannot be brought back by whoever closed it, so a borrowed session
             or an unattended browser should not be able to spend it. Bounded the same
             way the sign-up field is, in bytes, because bcrypt reads at most 72 of
             them (auth/v1/auth.proto).
            string.max_bytes = 72
            string.min_bytes = 8
      title: DeleteAccountRequest
      additionalProperties: false
      description: |-
        Request to close the account the request is authenticated as. It names no
         account: what is closed is the one the token resolves to, so a client cannot
         aim this at anybody else.
    account.v1.DeleteAccountResponse:
      type: object
      properties:
        purgeAt:
          title: purge_at
          description: |-
            When the account and everything belonging to it stops existing. Closing is
             recorded rather than carried out, so that an account closed by mistake can
             still be restored until this instant; afterwards the rows are deleted and
             nothing can be. Restoring is not something the API offers, since a closed
             account cannot log in to ask for it. The address stays taken until this
             instant as well, SignUp refusing it like any other address in use, so that
             what is restored still has somewhere to be (auth/v1/auth.proto).
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: DeleteAccountResponse
      additionalProperties: false
      description: Response to closing an account.
    auth.v1.LogInRequest:
      type: object
      properties:
        email:
          type: string
          title: email
          maxLength: 254
          format: email
          description: Address the account is identified by. Matched case-insensitively.
        password:
          type: string
          title: password
          description: |
            Secret the account was created with.
            string.max_bytes = 72
            string.min_bytes = 8
      title: LogInRequest
      additionalProperties: false
      description: Credentials of an existing account.
    auth.v1.LogInResponse:
      type: object
      properties:
        token:
          title: token
          description: Token for the account named in the request.
          $ref: '#/components/schemas/auth.v1.Token'
      title: LogInResponse
      additionalProperties: false
      description: Response containing the token of the account that was logged in to.
    auth.v1.LogOutRequest:
      type: object
      title: LogOutRequest
      additionalProperties: false
      description: |-
        Request to end the current session. It names nothing: what is ended is the
         session the request carries, in its cookie or its Authorization header.
    auth.v1.LogOutResponse:
      type: object
      title: LogOutResponse
      additionalProperties: false
      description: Response to logging out. It carries no data.
    auth.v1.SignUpRequest:
      type: object
      properties:
        email:
          type: string
          title: email
          maxLength: 254
          format: email
          description: |-
            Address the account is identified by. Stored lower-cased, so addresses
             differing only in case are the same account.
        password:
          type: string
          title: password
          description: |
            Secret the account is unlocked with. Bounded in bytes rather than
             characters because bcrypt reads at most 72 of them and would silently
             ignore the rest, making a longer password weaker than it looks.
            string.max_bytes = 72
            string.min_bytes = 8
      title: SignUpRequest
      additionalProperties: false
      description: Credentials for a new account.
    auth.v1.SignUpResponse:
      type: object
      properties:
        token:
          title: token
          description: Token for the account that was just created.
          $ref: '#/components/schemas/auth.v1.Token'
      title: SignUpResponse
      additionalProperties: false
      description: Response containing the token of the newly created account.
    auth.v1.Token:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
          description: Value of the Authorization header, after the "Bearer " prefix.
        expiresAt:
          title: expires_at
          description: |-
            When the token stops being accepted, and when the cookie expires. There is
             nothing to refresh it with, so a client past this has to log in again.
             LogOut ends a session before this, so a token can stop being served
             earlier than it says here.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Token
      additionalProperties: false
      description: |-
        What a client is authenticated by. SignUp and LogIn also set the same value
         as an HttpOnly session cookie, which is what a browser is meant to use: it
         travels on its own and no script on the page can read it. Clients that are
         not browsers take the token from here and send it themselves.
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    todo.v1.CreateTodoRequest:
      type: object
      properties:
        title:
          type: string
          title: title
          description: |
            Title of the todo to create. Leading and trailing whitespace is trimmed
             before storage, and todo_title applies to the trimmed value.
            title.max_len = true // title must be at most 1000 characters
            title.not_blank = true // title must not be blank
      title: CreateTodoRequest
      additionalProperties: false
      description: Request to create a new todo.
    todo.v1.CreateTodoResponse:
      type: object
      properties:
        todo:
          title: todo
          description: The stored todo, including its assigned id.
          $ref: '#/components/schemas/todo.v1.Todo'
      title: CreateTodoResponse
      additionalProperties: false
      description: Response containing the newly created todo.
    todo.v1.DeleteTodoRequest:
      type: object
      properties:
        id:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: id
          format: int64
          description: |-
            Identifier of the todo to delete. Ids are assigned from 1 up, so a
             smaller value cannot identify a todo.
      title: DeleteTodoRequest
      additionalProperties: false
      description: Request to delete an existing todo.
    todo.v1.DeleteTodoResponse:
      type: object
      title: DeleteTodoResponse
      additionalProperties: false
      description: Response to a deletion. It carries no data.
    todo.v1.ListTodosRequest:
      type: object
      properties:
        pageSize:
          type: integer
          title: page_size
          maximum: 100
          minimum: 0
          format: int32
          description: |-
            How many todos to return at most. Zero asks for the server's default of
             50.
        pageToken:
          type: string
          title: page_token
          description: |
            Opaque token taken from the previous response's next_page_token. Empty
             starts at the first page. Clients must not build one themselves.
            page_token.format // page_token is not a valid token
      title: ListTodosRequest
      additionalProperties: false
      description: Request to list one page of todos.
    todo.v1.ListTodosResponse:
      type: object
      properties:
        todos:
          type: array
          items:
            $ref: '#/components/schemas/todo.v1.Todo'
          title: todos
          description: The todos on this page, ordered by id. Empty when the page has none.
        nextPageToken:
          type: string
          title: next_page_token
          description: Token that fetches the next page. Empty on the last page.
      title: ListTodosResponse
      additionalProperties: false
      description: Response containing one page of todos.
    todo.v1.Todo:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
          description: Unique identifier assigned by the database.
        title:
          type: string
          title: title
          description: Human readable description of what has to be done.
        done:
          type: boolean
          title: done
          description: Whether the item has been completed.
        createdAt:
          title: created_at
          description: When the item was created, assigned by the database.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Todo
      additionalProperties: false
      description: A single todo item.
    todo.v1.UpdateTodoRequest:
      type: object
      properties:
        id:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: id
          format: int64
          description: |-
            Identifier of the todo to update. Ids are assigned from 1 up, so a
             smaller value cannot identify a todo.
        done:
          type:
            - boolean
            - "null"
          title: done
          description: Desired completion state. Left unchanged when absent.
        title:
          type:
            - string
            - "null"
          title: title
          description: |
            New title for the todo. Left unchanged when absent. Trimmed and validated
             the same way as CreateTodoRequest.title.
            title.max_len = true // title must be at most 1000 characters
            title.not_blank = true // title must not be blank
      title: UpdateTodoRequest
      additionalProperties: false
      description: |
        Request to update an existing todo.
        update.no_fields // at least one of done or title must be present
    todo.v1.UpdateTodoResponse:
      type: object
      properties:
        todo:
          title: todo
          description: The todo after the update was applied.
          $ref: '#/components/schemas/todo.v1.Todo'
      title: UpdateTodoResponse
      additionalProperties: false
      description: Response containing the updated todo.
  securitySchemes:
    bearerAuth:
      type: http
      description: Token issued by AuthService (auth/v1/auth.proto).
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
tags:
  - name: account.v1.AccountService
    description: |-
      Acts on the account a token names, as opposed to AuthService, which hands
       the tokens out. Every procedure here requires one.
  - name: auth.v1.AuthService
    description: |-
      Issues the tokens the rest of the API requires. Its own procedures are the
       only ones reachable without one.
  - name: todo.v1.TodoService
    description: |-
      Operations on todo items. Every procedure works on the todos of the account
       named by the request's bearer token (auth/v1/auth.proto) and fails with the
       unauthenticated code without a valid one.
