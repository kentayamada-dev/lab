{
  "connections": {
    "app-db": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "app",
      "save-password": true,
      "configuration": {
        "host": "${DB_HOST}",
        "port": "${DB_PORT}",
        "database": "${DB_NAME}",
        "configurationType": "MANUAL",
        "auth-properties": {
          "user": "${DB_USER}",
          "password": "${DB_PASSWORD}"
        }
      }
    }
  }
}
