# CI が使う検査ツールとそのバージョン。.github/workflows/ci.yml と link-check.yml が、ここに書いた版を
# mise 経由で導入する。手元でも `mise install` と `mise exec -- <ツール>` で同じ版を再現できる。
#
# 導入手段は mise に一本化する。版を固定して Renovate に追わせられ、arm ランナーに揃えられ、
# 導入時に aqua レジストリの定義に従ってチェックサム・署名・provenance が検証されるため。
#
# renovate-config-validator は mise のレジストリに無いため、ci.yml で Renovate のイメージを使う。
# notify-drift-issue の gh・jq は結果が版に依存しないため、ランナーに同梱のものを使う。
#
# 版の更新は Renovate の mise manager が追う。https://docs.renovatebot.com/modules/manager/mise/
#
# 版に v を付けない。mise は aqua のタグから先頭の v を落とした形を版とし、Renovate も v を落として比較するため。
# https://github.com/jdx/mise/blob/v2026.10.1/src/backend/aqua.rs#L5620
# https://github.com/renovatebot/renovate/blob/44.132.2/lib/modules/manager/mise/backends.ts#L40
#
# この設定は [tools] にプレーンなバージョン文字列を書くだけなので、mise trust は要らない。
# https://mise.jdx.dev/cli/trust.html
#
# mise.lock は置かない。全ツールを完全な版で固定し、検証も aqua レジストリに任せているため（必要なら mise lock と --locked）。
# https://mise.jdx.dev/dev-tools/mise-lock.html
[tools]
# シェルスクリプトの検査。actionlint も run: の中身を検査する際に PATH 上の shellcheck を使う
"aqua:koalaman/shellcheck" = "0.11.0"

# シェルスクリプトの整形の検査（shellcheck も editorconfig-checker も整形は見ない）。設定は .editorconfig に置く（理由はそちら）。
# .bats は拡張子から bats 方言と判別されるので -ln は不要（v3.14.1 で実測）。
# https://github.com/mvdan/sh/blob/master/cmd/shfmt/shfmt.1.scd
"aqua:mvdan/sh" = "3.14.1"

# JSON の構文検査（jq empty）と、bats テストが実物を使う jq（scripts/test/helper.bash は gh だけをスタブに
# 差し替え、jq は実物を呼ぶ）。ランナー上で動く notify-drift-issue の jq はランナー同梱のものを使う
"aqua:jqlang/jq" = "1.8.2"

# 検査スクリプト（check-action-shell.sh・check-required-checks.sh）が YAML から値を取り出すのに使う。
# mise の公式イメージにも、ジョブがコンテナで動くランナーにも無いため、ここで固定して入れる。
"aqua:mikefarah/yq" = "4.54.1"

# uv は pipx バックエンドの導入に使われ、mise の公式イメージに無いため固定する。
# https://mise.jdx.dev/dev-tools/backends/pipx.html
# pypi ではなく pipx と書く。古い mise は pypi を解釈せずこの行を黙って無視するため（2026.8.10 で実測）。
# https://mise.jdx.dev/dev-tools/backends/pypi.html
"aqua:astral-sh/uv" = "0.12.24"
"pipx:yamllint" = "1.38.0"

# TOML（mise.toml・.github/ci.lychee.toml）の構文と整形の検査。ci.lychee.toml の誤りは定期実行まで気づけないため。
#
# システム設定へのアクセスを制限したサンドボックス下の macOS では、起動時に panic して何もせず終わる
# （"Attempted to create a NULL object."）。制限の無い macOS では検査できる（0.10.0 で実測）。
"aqua:tamasfe/taplo" = "0.10.0"

# バイナリ版は run: の検査に PATH 上の shellcheck・pyflakes を使う。pyflakes は python の run: が無いため入れていない。
# https://github.com/rhysd/actionlint/blob/main/docs/checks.md
"aqua:rhysd/actionlint" = "1.7.12"

# GitHub Actions のセキュリティ方針の検査
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"

# actionlint・ghalint と一部重なるが、$GITHUB_ENV 経由の実行やキャッシュ汚染など相手に無い検査があるため併用する。
# 検査内容の調整は .github/ci.zizmor.yml。https://docs.zizmor.sh/audits/
"aqua:zizmorcore/zizmor" = "1.30.1"

# Dockerfile の検査。RUN の中身の検査には shellcheck を内蔵しており、PATH 上のものには依存しない
"aqua:hadolint/hadolint" = "2.15.1"

"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"

# Markdown の検査。JavaScript 実装のため npm バックエンドで入れる。
"npm:markdownlint-cli2" = "0.23.3"

# markdownlint-cli2 の実行に要る。CI が使う mise の -debian イメージには Node.js が無く、実行時に node: not found で落ちる。
# https://github.com/jdx/mise/blob/main/packaging/debian/Dockerfile
node = "24.21.0"

# 綴りの検査
"aqua:crate-ci/typos" = "1.50.3"

# 秘密情報の検査。GitHub のプッシュ保護が止める提携トークン以外の文字列も既定ルールで検出するため併用する
# （無料版が提携パターンに限られるかは未確認）。
"aqua:betterleaks/betterleaks" = "1.9.0"

# 依存の既知の脆弱性の検査。ロックファイルやマニフェスト（api/go.mod など）を OSV と突き合わせる。
# https://google.github.io/osv-scanner/supported-languages-and-lockfiles/
#
# mise.toml と uses: は読む extractor が osv-scalibr に無く対象外（uses: は zizmor の known-vulnerable-actions）。
# https://github.com/google/osv-scalibr/tree/main/extractor/filesystem/language
#
# aqua レジストリの定義に supported_envs の制限が無く、CI の arm ランナー（linux/arm64）でも入る。
# https://github.com/aquaproj/aqua-registry/blob/main/pkgs/google/osv-scanner/registry.yaml
"aqua:google/osv-scanner" = "2.6.0"

# リンク切れの検査（link-check.yml。CI の必須チェックではなく定期実行）
"aqua:lycheeverse/lychee" = "0.24.2"

# シェルスクリプトのテスト。各テストの helper.bash が bats_require_minimum_version 1.5.0 を要求する
"aqua:bats-core/bats-core" = "1.14.0"
