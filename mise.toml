#:schema https://mise.jdx.dev/schema/mise.json
# Intentionally no mise.lock. Renovate can only rewrite versions in mise.toml
# (updating the lock requires permission settings on the self-hosted side), and
# with a lock present mise-action uses `mise install --locked`, so update PRs
# fail when the lock disagrees with mise.toml.
[tools]
actionlint = "1.7.12"
bats = "1.14.0"
"pipx:check-jsonschema" = "0.38.0"
editorconfig-checker = "3.11.2"
ghalint = "1.5.6"
gitleaks = "8.30.1"
hadolint = "2.15.1"
lychee = "0.24.2"
shellcheck = "0.11.0"
shfmt = "3.14.0"
typos = "1.50.0"
zizmor = "1.30.0"

# One task per check job in ci.yml that can run from a local checkout, named after
# it (docs/ci-jobs.md#検査を手元で再現する).
[tasks.check]
description = "Run every CI check that works from a local checkout"
depends = ["check:*"]

[tasks."check:format"]
description = ".editorconfig compliance and shell script formatting"
shell = "bash -c"
run = '''
set -euo pipefail
ec
git ls-files -z '*.sh' '*.bash' \
  | xargs -0 -r shfmt -d -i 2 -ci
'''

[tasks."check:actionlint"]
description = "Lint workflow files"
run = "actionlint -color"

[tasks."check:shellcheck"]
description = "Lint shell scripts"
shell = "bash -c"
run = '''
set -euo pipefail
git ls-files -z '*.sh' '*.bash' \
  | xargs -0 -r shellcheck --color=always --external-sources
'''

[tasks."check:hadolint"]
description = "Lint Dockerfiles"
shell = "bash -c"
run = '''
set -euo pipefail
git ls-files -z '*Dockerfile' '*Dockerfile.*' '*.dockerfile' \
  | xargs -0 -r hadolint
'''

[tasks."check:typos"]
description = "Check for typos"
run = "typos --color always"

[tasks."check:lychee"]
description = "Check for broken links and broken anchors in Markdown"
# Why --exclude-path: docs/ci-jobs.md#lychee
run = '''
lychee --offline --include-fragments --no-progress \
  --exclude-path api/internal/server/swagger-ui-bundle.js \
  --exclude-path api/internal/server/swagger-ui-bundle.js.LICENSE.txt \
  --exclude-path api/internal/server/swagger-ui.css \
  --exclude-path api/internal/server/swagger.html \
  .
'''

[tasks."check:ghalint"]
description = "Lint workflow files for security policies"
run = "ghalint run"

[tasks."check:zizmor"]
description = "Audit workflow files for security issues"
run = "zizmor --color=always --strict-collection ."

[tasks."check:gitleaks"]
description = "Scan git history for secrets"
run = "gitleaks git --redact --verbose --no-banner"

[tasks."check:hooks"]
description = "Test the Claude Code hooks"
shell = "bash -c"
run = '''
set -euo pipefail
git ls-files -z '.claude/tests/*.bats' \
  | xargs -0 -r bats --print-output-on-failure
'''

[tasks."check:script-tests"]
description = "Test the scripts the workflows call"
shell = "bash -c"
run = '''
set -euo pipefail
git ls-files -z '.github/scripts/tests/*.bats' 'scripts/tests/*.bats' \
  | xargs -0 -r bats --print-output-on-failure
'''

[tasks."check:issue-forms"]
description = "Validate issue forms"
shell = "bash -c"
run = '''
set -euo pipefail
git ls-files -z '.github/ISSUE_TEMPLATE/*.yml' '.github/ISSUE_TEMPLATE/*.yaml' \
  ':!:.github/ISSUE_TEMPLATE/config.yml' ':!:.github/ISSUE_TEMPLATE/config.yaml' \
  | xargs -0 -r check-jsonschema --builtin-schema vendor.github-issue-forms
git ls-files -z '.github/ISSUE_TEMPLATE/config.yml' '.github/ISSUE_TEMPLATE/config.yaml' \
  | xargs -0 -r check-jsonschema --builtin-schema vendor.github-issue-config
'''
