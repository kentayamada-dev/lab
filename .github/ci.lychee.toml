# lychee の設定。ci.yml の --offline の検査とも共有するため .github/ 直下に置き、-c 省略時に読まれる lychee.toml と
# 名前を変えて呼び出し側から明示的に渡す。パスは実行ディレクトリ基準なので、リポジトリ直下から実行する
# キー一覧: https://github.com/lycheeverse/lychee/blob/master/lychee.example.toml

# 既定の extensions は .yml / .sh を含まず、URLの大半があるワークフローのコメントとスクリプトが対象外になるため広げる
# https://github.com/lycheeverse/lychee#supported-file-formats
extensions = ["md", "yml", "yaml", "sh", "bash", "bats", "json", "json5", "txt"]

# 既定では隠しディレクトリを読み飛ばすため、.github/ と .claude/ が丸ごと対象から外れる（typos と同じ事情。ci.yml 参照）。
hidden = true

# hidden = true にすると .git/ 以下も走査対象に入る。上の extensions に一致するファイルは
# .git/ の中には無いはずだが、その前提に頼らず走査自体を避ける。値は正規表現。
exclude_path = ['(^|/)\.git/']

exclude = [
  # example.test は RFC 6761 がテスト用に予約している TLD で、名前解決できないのが正しい挙動。
  # .github/actions/*/test の bats フィクスチャで使っている。
  # https://www.rfc-editor.org/rfc/rfc6761#section-6.2
  '^https?://([^/]*\.)?example\.test(/|$)',

  # Draft-07 の $schema 識別子は仕様上 http:// で、リンクではないため require_https から外す（settings-drift のテストで使用）
  # https://json-schema.org/draft-07/draft-handrews-json-schema-validation-01
  '^http://json-schema\.org/',

  # ruleset-drift のテストフィクスチャ（test/helper.bash）のダミーURLで、到達しないのが正しい
  '^https://api\.github\.com/x$',
]

# 既定では #アンカーが参照先に無くても通るため、アンカーとテキストフラグメント（#:~:text=）も検査する
include_fragments = "full"

# HTTPS で到達できる URL に http:// でリンクしている箇所を失敗にする。既定は false。
require_https = true
