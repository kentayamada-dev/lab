---
# yamllint の設定。GitHub Actions からしか使わないため .github/ に置き、ci.yml から -c で明示的に渡す。
# ci. を付けるのは .github/ で実行したときだけ自動検出されるのを避けるため。CI 側の --strict で warning も失敗にする
extends: default

rules:
  # 日本語のコメントは80文字だと細切れになるため120に広げる。Renovate が更新する
  # image: <版>@sha256:<digest> の行は120を超え折り返せないため、空白の無い値を長さ検査から外す
  line-length:
    max: 120
    allow-non-breakable-inline-mappings: true

  # ワークフローの on: キーが YAML 1.1 の真偽値として指摘されるため、キーの検査だけ外す（値の検査は残す）
  # https://yamllint.readthedocs.io/en/stable/rules.html#module-yamllint.rules.truthy
  truthy:
    check-keys: false
