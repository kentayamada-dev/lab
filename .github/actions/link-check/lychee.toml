# lychee（リンク切れ検査）の設定。
# 使うのは隣の check-links.sh だけなので同じディレクトリに置き、スクリプトが --config で明示的に
# 渡している（-c を省略したときの既定値はカレントディレクトリの lychee.toml のため、ここに置くと読まれない）。
# キー名の一覧: https://github.com/lycheeverse/lychee/blob/master/lychee.example.toml
#
# 検査対象と除外という実行環境によらない設定だけをここに置き、出力形式などの実行時の指定はスクリプト側で渡す。
# 手元で同じ検査をするときは `.github/actions/link-check/check-links.sh`。
# パスの解釈は設定ファイルの位置ではなく実行ディレクトリ基準なので、リポジトリ直下から実行する。

# 既定の extensions は md,markdown,mdx,qmd,rmd,mkd,mkdn,mdwn,mdown,mkdown,html,htm,css,txt,xml で、
# .yml と .sh を含まない。このリポジトリのURLは大半がワークフローのコメントとシェルスクリプトの中にあり、
# 既定のままだと Markdown 以外がまるごと対象から外れる。
# lychee は Markdown・HTML 以外を「プレーンテキスト」として扱い、linkify でURLを拾う。
# https://github.com/lycheeverse/lychee#supported-file-formats
extensions = ["md", "yml", "yaml", "sh", "bash", "bats", "json", "json5", "txt"]

# 既定では隠しディレクトリを読み飛ばすため、.github/ と .claude/ が丸ごと対象から外れる（typos と同じ事情。ci.yml 参照）。
hidden = true

# hidden = true にすると .git/ 以下も走査対象に入る。上の extensions に一致するファイルは
# .git/ の中には無いはずだが、その前提に頼らず走査自体を避ける。値は正規表現。
exclude_path = ['(^|/)\.git/']

exclude = [
  # example.test は RFC 6761 がテスト用に予約している TLD で、名前解決できないのが正しい挙動。
  # .github/actions/*/test の bats フィクスチャで使っている。
  # https://www.rfc-editor.org/rfc/rfc6761#section-6.2
  '^https?://([^/]*\.)?example\.test(/|$)',

  # JSON Schema の識別子。Draft-07 の $schema の値は仕様が
  # http://json-schema.org/draft-07/schema# と定めており、https に置き換えると別の識別子になる。
  # リンクとして参照しているわけではないので require_https の対象から外す。
  # .github/actions/settings-drift/test/helper.bash が、検証するスキーマの $schema として使っている。
  '^http://json-schema\.org/',

  # ルールセット API の応答を模したテストフィクスチャのダミーURL。
  # .github/actions/ruleset-drift/test/helper.bash で _links.self.href に入れているだけで、
  # 到達しないのが正しい。
  '^https://api\.github\.com/x$',
]

# URL のフラグメントの存在も確かめる。既定は無効で、#section のようなアンカーが参照先に
# 存在しなくてもリンク切れとして扱われない。full はアンカー（#section）とテキストフラグメント
# （#:~:text=）の両方を対象にする。
include_fragments = "full"

# HTTPS で到達できる URL に http:// でリンクしている箇所を失敗にする。既定は false。
require_https = true
