---
# markdownlint-cli2 の設定。.markdownlint-cli2.yaml だと .github/ のディレクトリ設定として自動検出され、
# 下の overrides の filter の基準がずれるため ci. を付け、ci.yml から --config で渡す
# https://github.com/DavidAnson/markdownlint-cli2#markdownlint-cli2yaml

# 公式イメージに git が無いため git ls-files ではなく glob で指定する（v0.23.2 で実測）。
# --config で渡した設定の globs も検査対象に足される（v0.23.2 のソースで確認）。実行ディレクトリ基準で解決される
# https://github.com/DavidAnson/markdownlint-cli2#markdownlint-cli2jsonc
globs:
  - "**/*.md"

config:
  # MD013（行長）は既定80桁。日本語のドキュメントを80桁に収めると文の途中で改行することになり、
  # どこで折るかは機械的に決められないため無効にする（実測では SKILL.md の1行が89桁で引っかかった）。
  MD013: false

  # SKILL.md のフロントマターは title ではなく name を持つため、既定のままだと「先頭が見出しでない」と誤検知する
  # https://github.com/DavidAnson/markdownlint/blob/main/doc/md041.md
  MD041:
    front_matter_title: "^\\s*name\\s*[:=]"

# PRテンプレートは全PR本文の先頭に挿入されるため、このファイルだけ MD041 を外す。filter・config・combine は必須で、
# filter はリポジトリ直下からのパスで書く（ci. の説明を参照）。キー名を誤ってもエラーにならず無視される（未検証）
# https://github.com/DavidAnson/markdownlint-cli2#markdownlint-cli2jsonc
overrides:
  - filter:
      - ".github/pull_request_template.md"
    config:
      MD041: false
    combine: merge
