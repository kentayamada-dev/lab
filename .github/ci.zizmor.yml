---
# zizmor の設定。persona は ci.yml で auditor を指定している。自動検出名を避け ci.yml から --config で渡す。
# 自動検出だと改名・移動で設定が外れても、無効化したはずの指摘として現れ原因が分からないため（1.30.1 で実測）
# https://docs.zizmor.sh/configuration/

rules:
  # actionlint が `uses: $/...` を知らず該当箇所を全て落とすため無効化（1.7.12 で実測）。
  # actionlint が対応したら、この設定を消して `uses: $/...` へ移行する
  # https://github.blog/changelog/2026-07-30-reference-same-repository-actions-with-self-repository-syntax/
  # https://github.com/rhysd/actionlint/pull/732
  self-repository:
    disable: true

  # 冒頭の permissions は、新しいジョブが書き忘れたときの下限として意図的に置いている（方針は ci.yml）。
  # pedantic 以上でのみ出る指摘（1.30.1 で実測）で、本物の過剰権限を見逃さないようルールは残し対象だけ外す
  excessive-permissions:
    ignore:
      - ruleset-drift.yml
      - settings-drift.yml

  # environment の価値は承認などの保護ルールにあり、Renovate とルールセット読み取りのトークンには
  # 実行のたびに人手の承認を挟む理由が無いため外す（auditor persona でのみ出る指摘。1.30.1 で実測）
  # https://docs.zizmor.sh/audits/#secrets-outside-env
  secrets-outside-env:
    ignore:
      - renovate.yml
      - ruleset-drift.yml
