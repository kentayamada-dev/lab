---
# actionlint が GitHub ホストの ubuntu-26.04 / ubuntu-26.04-arm を未知ラベルとして全ジョブを落とすため登録する（v1.7.12 で実測）。
# 自動検出名を避け ci.yml から -config-file で渡す（改名時に原因不明の runner-label エラーになるため）。upstream 対応後は削除する
# https://github.com/rhysd/actionlint/issues/682
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
