name: 作業項目
description: 追加したい機能、やるべき作業
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: やりたいこと
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景・理由
      description: なぜ必要か、今どんな問題が起きているか。
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: 完了の条件
      description: この issue を閉じてよいと言える状態。
    validations:
      required: false
