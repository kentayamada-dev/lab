name: バグ報告
description: 動作がおかしい、エラーが出る
labels: [bug]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 起きたこと
      description: この欄にはスクリーンショットを貼り付けられます。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 環境
      description: OS、ブラウザ、バージョンなど、関係しそうなもの。
      placeholder: 例) macOS 14 / Chrome 126 / v2.3.1
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: エラーメッセージ / ログ
      description: そのまま貼り付けてください。送信時に自動でコードブロックになります。
      render: shell
    validations:
      required: false
