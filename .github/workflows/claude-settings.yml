name: claude-settings

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
  # Run on pushes to main too, so a bad edit surfaces right after the merge
  # instead of at the next scheduled run. Why this is not a ci job:
  # docs/ci-jobs.md#claude-code-設定の定期検査
  push:
    branches: [main]

# Serialized: validating the same file twice at once gains nothing.
concurrency:
  group: claude-settings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.8
          install_args: pipx:check-jsonschema
          cache_save: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate the Claude Code settings against the schema
        id: check
        run: |
          set -eo pipefail
          # pipefail is set above because otherwise tee's exit code hides a failed check.
          check-jsonschema \
            --schemafile https://json.schemastore.org/claude-code-settings.json \
            .claude/settings.json 2>&1 | tee "${RUNNER_TEMP}/check.log"

      # steps.check.outcome is part of the condition so that a failure in another
      # step, such as checkout, does not open a bogus "settings are invalid" issue.
      - name: Report the mismatch as an issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: The Claude Code settings do not match the schema
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/claude-settings.yml
        run: |
          set -eo pipefail
          {
            echo "The [\`claude-settings\`](${WORKFLOW_URL}) check failed."
            echo
            echo "Run log: ${RUN_URL}"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/check.log"
            echo '```'
            echo
            echo "Either an edit to \`.claude/settings.json\` misspelled a key, or the schema moved"
            echo "underneath an unchanged file — a Claude Code release renaming or removing a key."
            echo "The fix is the settings file in both cases. You can run the same check locally with:"
            echo
            echo '```bash'
            echo 'check-jsonschema --schemafile https://json.schemastore.org/claude-code-settings.json .claude/settings.json'
            echo '```'
            echo
            echo "Once fixed, this issue closes automatically on the next run."
          } >"${RUNNER_TEMP}/issue.md"
          ./.github/scripts/upsert-issue.sh \
            --title "${TITLE}" \
            --body-file "${RUNNER_TEMP}/issue.md" \
            --label maintenance \
            --on-existing skip

      - name: Close the issue when the settings match again
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: The Claude Code settings do not match the schema
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./.github/scripts/close-issues-by-title.sh "${TITLE}" \
            "Closing because the check passed: ${RUN_URL}"
