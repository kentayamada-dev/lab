---
name: Renovate

# Renovate を Actions で自前運用する実行設定（何を更新するかは .github/renovate.json5）。PAT の登録手順は README。
# 既定の GITHUB_TOKEN ではワークフローを更新できず PR の CI も承認待ちになり、自動マージが成立しないため PAT を使う。
# https://github.com/renovatebot/github-action#readme

on:
  schedule:
    # 毎日 06:00 JST。GitHubの仕様上、実行時刻は数分〜数十分遅れることがある。
    # editorconfig-checker-disable-next-line
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
    - cron: "0 21 * * *"
  # Dependency Dashboard は各実行の最後にしか更新されないため、Renovate の PR がマージされたら再実行する（#14）。
  # 絞り込みは on: では書けないのでジョブの if で行う。https://docs.renovatebot.com/getting-started/running/
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "PR やブランチを作らず、何をするかをログに出すだけにする"
        type: boolean
        default: false
      log-level:
        description: "Renovate のログレベル"
        type: choice
        options:
          - info
          - debug
        default: info

# ワークフロー自身の GITHUB_TOKEN は使わない。書き込みはすべて PAT で行う
permissions:
  contents: read

# 同じリポジトリに対して並走すると同じ更新のブランチを二重に触りうるため、直列化する
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30

    # 同一リポジトリの renovate/（branchPrefix の既定値）の PR がマージされたときだけ動かす。fork 発は Secrets が渡らず失敗するだけ。
    # https://docs.renovatebot.com/configuration-options/#branchprefix
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.merged
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'renovate/'))

    permissions:
      contents: read

    steps:
      # checkout は不要（Renovate が自分で clone し、グローバル設定は RENOVATE_* 環境変数で渡すため）。
      # renovate-version は中身がぶれないよう固定する。Renovate 自身が更新し、digest を付けない理由は renovate.json5。
      - name: Renovateを実行
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321  # v46.3.6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.132.2
        env:
          # 対象はこのリポジトリだけ。autodiscover は使わない
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # gitAuthor は指定しない。自分のアドレスにすると手動 push を「未変更」と誤認して上書きされうるため、
          # Unverified でも既定のままにする。https://github.com/renovatebot/renovate/discussions/39309
          # workflow_dispatch 以外（schedule / pull_request）では inputs が空なので、通常実行になる
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
