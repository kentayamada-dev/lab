---
name: Claude Code settings drift check

on:
  schedule:
    # 毎日 09:00 JST。GitHubの仕様上、実行時刻は数分〜数十分遅れることがある。
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # 定義ファイルとの差分を検知したら issue で通知するため

# 同時実行すると同じ内容のissueが二重に作られうるため、直列化する
concurrency:
  group: settings-drift
  cancel-in-progress: false

jobs:
  check:
    name: Settings drift check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write  # 定義ファイルとの差分を検知したら issue で通知するため

    env:
      SETTINGS_FILE: .claude/settings.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 検査ロジックは、ローカルでも同じ結果を再現できるように .github/actions/settings-drift の
      # スクリプトに置き、その action が終了コードを出力 drift（true / false）に写す。
      # 検査自体の失敗（ドキュメント取得失敗など、終了コード2）は action 側で即失敗させる。
      #
      # リポジトリ設定で実行可能なアクションを GitHub 公式と検証済みに限っているが（ci.yml 冒頭）、
      # 同じリポジトリ内のローカルアクション（./）はその設定でも常に許可される。
      # https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-github-actions-settings-for-a-repository#allowing-select-actions-and-reusable-workflows-to-run
      - name: 公式ドキュメントとスキーマに対して settings.json を検査
        id: check
        uses: ./.github/actions/settings-drift
        with:
          settings-file: ${{ env.SETTINGS_FILE }}
          report-file: report.md

      # 結果のサマリー出力と issue での通知は ruleset-drift.yml と共通なので、1つの action に置いている。
      # drift があれば issue を作成・追記したうえで、この action がジョブを失敗させる
      - name: 結果をジョブサマリーに出力し、drift があれば issue で通知
        uses: ./.github/actions/notify-drift-issue
        with:
          drift: ${{ steps.check.outputs.drift }}
          report-file: report.md
          # report.md の1行目には check-settings-drift.sh が実行日時と索引行数を書くため、
          # 毎回変わるその行を除いてハッシュを取る。指摘内容が同じなら同じハッシュになる
          digest-skip-lines: "1"
          issue-title: "chore: .claude/settings.json のキーが公式ドキュメントと一致していない"
          issue-label: maintenance
          summary-drift: settings.json のキーに drift があります
          summary-ok: settings.json のキーは公式ドキュメントと一致しています
          close-comment: 定期チェックで `${{ env.SETTINGS_FILE }}` のキーが公式ドキュメントと一致したことを確認したため、自動でcloseしました。
          comment-intro: 検査結果が前回の通知から変わりました。
          report-heading: 検査結果
          report-note: 検査結果が変わった場合はコメントで追記されます。
          issue-description: |-
            定期チェック（`settings-drift.yml`）で、`${{ env.SETTINGS_FILE }}` のキーが公式ドキュメント・公開スキーマと一致しませんでした。
            Claude Code 側でキーの削除・改名・スコープ変更があった可能性があります。
          issue-extra-sections: |-
            ## 参照

            - 設定リファレンス: https://code.claude.com/docs/en/settings-reference
            - 公開スキーマ: https://json.schemastore.org/claude-code-settings.json
          completion-criteria: |-
            - [ ] 該当キーの現在の仕様（削除・改名・スコープ）をドキュメントで確認した
            - [ ] `${{ env.SETTINGS_FILE }}` を修正するPRを出した、または問題なしと判断した根拠を記録した
            - [ ] このワークフローを手動実行して成功することを確認した
