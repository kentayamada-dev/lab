---
name: Link check

# リポジトリ内のURLの生存を定期的に確かめる。外部サイトの一時的な不調やレート制限で
# リポジトリと無関係にマージが止まらないよう、PRの必須チェックにはせず issue で通知する

on:
  schedule:
    # 毎日 10:00 JST。drift 系（09:00 JST）と1時間ずらして実行が重ならないようにしている。
    # GitHubの仕様上、実行時刻は数分〜数十分遅れることがある。
    # editorconfig-checker-disable-next-line
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 同時実行すると同じ内容のissueが二重に作られうるため、直列化する
concurrency:
  group: link-check
  cancel-in-progress: false

# lychee は mise のコンテナで、notify-drift-issue はランナー同梱の gh で動くためジョブを分け、結果は artifact で渡す
jobs:
  check:
    name: Link check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20

    permissions:
      contents: read

    container:
      # ci.yml の lint ジョブと同じ mise の公式イメージ（選定理由はそちらのコメント）
      image: ghcr.io/jdx/mise:2026.10.5-debian@sha256:ac140bcb5d4a989d3f66eb651263915154c33fa65134d63db4f7edf110ce87cc

    outputs:
      drift: ${{ steps.check.outputs.drift }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 要るのは lychee だけなので単体で入れる。$GITHUB_PATH は後続のローカルアクションの中にも効く
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#adding-a-system-path
      - name: lycheeを導入
        run: |
          mise install aqua:lycheeverse/lychee
          mise bin-paths >> "$GITHUB_PATH"

      - name: リンク切れを検査
        id: check
        uses: ./.github/actions/link-check
        with:
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: link-check-report
          path: report.md

  notify:
    name: Notify
    needs: check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    # issue の書き込みが要るのはこのジョブだけなので、ワークフロー全体ではなくここで足す
    permissions:
      contents: read
      issues: write  # リンク切れを検知したら issue で通知するため

    steps:
      # ローカルアクション（./.github/actions/...）を使うためにチェックアウトが要る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: link-check-report

      # ruleset-drift.yml / settings-drift.yml と同じ通知の仕組みに乗せている。
      # リンク切れがあれば issue を作成・追記したうえで、この action がジョブを失敗させる
      - name: 結果をジョブサマリーに出力し、リンク切れがあれば issue で通知
        uses: ./.github/actions/notify-drift-issue
        with:
          drift: ${{ needs.check.outputs.drift }}
          report-file: report.md
          # lychee の markdown レポートは実行日時を含まず、入力も結果も文字列順に整列されるため（v0.24.2）、
          # digest-skip-lines は既定の 0 でよい
          # https://github.com/lycheeverse/lychee/blob/lychee-v0.24.2/lychee-bin/src/formatters/stats/markdown.rs
          # https://github.com/lycheeverse/lychee/blob/lychee-v0.24.2/lychee-bin/src/formatters/stats/mod.rs
          issue-title: "chore: リポジトリ内のリンクが切れている"
          issue-label: maintenance
          summary-drift: リンク切れがあります
          summary-ok: リンク切れはありません
          close-comment: 定期チェックでリンク切れが解消したことを確認したため、自動でcloseしました。
          comment-intro: リンク切れの内容が前回の通知から変わりました。
          report-heading: 検査結果
          report-note: リンク切れの内容が変わった場合はコメントで追記されます。
          issue-description: |-
            定期チェック（`link-check.yml`）で、リポジトリ内のURLに到達できないものが見つかりました。
            参照先の移動・削除か、一時的な障害の可能性があります。
          issue-extra-sections: |-
            ## 提案

            - 参照先が移動した: リンクを新しいURLに直すPRを出す
            - 参照先が消えた: 代わりの根拠を示すか、その記述ごと見直す
            - 一時的な障害・ボット遮断など、URL自体は正しい: `.github/ci.lychee.toml` の `exclude` に理由を書いて足す
          completion-criteria: |-
            - [ ] 検査結果の各URLについて、参照先が移動したのか消えたのか一時的な障害かを確認した
            - [ ] リンクを修正した、または `.github/ci.lychee.toml` に除外理由を書いて足した
            - [ ] このワークフローを手動実行して成功することを確認した
