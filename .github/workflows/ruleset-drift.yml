---
name: Ruleset drift check

on:
  schedule:
    # 毎日 09:00 JST。GitHubの仕様上、実行時刻は数分〜数十分遅れることがある。
    # editorconfig-checker-disable-next-line
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # 定義ファイルとの差分を検知したら issue で通知するため

# 同時実行すると同じ内容のissueが二重に作られうるため、直列化する
concurrency:
  group: ruleset-drift
  cancel-in-progress: false

jobs:
  check:
    name: Ruleset drift check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write  # 定義ファイルとの差分を検知したら issue で通知するため

    env:
      RULESET_FILE: .github/rulesets/main.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 検査ロジックは、ローカルでも同じ結果を再現できるように .github/actions/ruleset-drift の
      # スクリプトに置き、その action が終了コードを出力 drift（true / false）に写す。
      # 検査自体の失敗（トークンの権限不足・API取得失敗など、終了コード2）は action 側で即失敗させる。
      #
      # GITHUB_TOKEN ではなく専用のトークンを渡す。bypass_actors は「ルールセットへの write 権限が
      # ある要求元にだけ返す」仕様で、権限が無いとキーごとレスポンスから消えるが、GITHUB_TOKEN には
      # その権限を与えられない（permissions に administration スコープが無い）。
      # 未設定のまま動かすと、実際は一致していても差分として通知され続ける（#11）。
      # 発行と登録の手順は README の「ruleset-drift の事前準備」。
      # https://docs.github.com/en/rest/repos/rules
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
      - name: GitHub上のルールセットと定義ファイルを比較
        id: compare
        uses: ./.github/actions/ruleset-drift
        with:
          ruleset-file: ${{ env.RULESET_FILE }}
          report-file: drift.txt
          github-token: ${{ secrets.RULESET_READ_TOKEN }}

      # 結果のサマリー出力と issue での通知は settings-drift.yml と共通なので、1つの action に置いている。
      # 差分があれば issue を作成・追記したうえで、この action がジョブを失敗させる
      - name: 結果をジョブサマリーに出力し、差分があれば issue で通知
        uses: ./.github/actions/notify-drift-issue
        with:
          drift: ${{ steps.compare.outputs.drift }}
          report-file: drift.txt
          # diff -u に --label を渡しているためヘッダに更新日時が入らず、内容が同じならハッシュも同じになる
          report-format: diff
          issue-title: "chore: ルールセット main の定義ファイルとGitHub上の設定が一致していない"
          issue-label: maintenance
          summary-drift: ルールセットに差分があります
          summary-ok: ルールセットは定義ファイルと一致しています
          close-comment: 定期チェックで `${{ env.RULESET_FILE }}` とGitHub上のルールセットが一致したことを確認したため、自動でcloseしました。
          comment-intro: 差分が前回の通知から変わりました。左が定義ファイル、右がGitHub上の設定です。
          report-heading: 差分
          report-note: 左が定義ファイル、右がGitHub上の設定です。差分が変わった場合はコメントで追記されます。
          issue-description: |-
            定期チェック（`ruleset-drift.yml`）で、`${{ env.RULESET_FILE }}` とGitHub上のルールセットに差分が見つかりました。
            どちらかが意図せず変更されている可能性があります。
          issue-extra-sections: |-
            ## 提案

            - 定義ファイルが正: `scripts/apply-repo-settings.sh` を実行して反映する（冪等。手順は README）
            - GitHub上の設定が正: 定義ファイルを修正するPRを出す
          completion-criteria: |-
            - [ ] 差分の原因（どちらが意図した変更か）を特定した
            - [ ] 定義ファイルとGitHub上の設定を一致させた
            - [ ] このワークフローを手動実行して成功することを確認した
