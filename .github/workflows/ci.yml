---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 全ジョブに name を置く（zizmor の anonymous-definition）。必須チェックの名前は name になる（zizmor の CI で実測）ため、
# 変えるときは .github/rulesets/main.json を直し scripts/apply-repo-settings.sh を再実行する。
#
# 検査ツールは mise.toml に版を固定して mise で導入する（理由はそのファイル）。
# 全ツールが同じコンテナで動き、落ちた検査はステップ単位で分かるため lint の1ジョブにまとめる。
#
# scripts-test を lint の needs にぶら下げず、独立した必須チェックにしている。
# needs の依存先が失敗してスキップされたジョブは required check としてマージを止めない場合があるため。
# editorconfig-checker-disable-next-line
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
#
# サードパーティのアクションは使わない。リポジトリ設定で実行可能なアクションを GitHub 公式と
# 検証済みに限っているため（scripts/apply-repo-settings.sh の selected-actions）。
#
# 検査ツールの設定は .github/ci.<ツール名>.* に置き、引数で明示的に渡す。自動検出だと改名・移動が
# 「設定が読めない」ではなく大量の誤検知として現れるため（実測は各ファイルの冒頭）。
#
# 全ジョブの permissions・timeout-minutes・persist-credentials: false は ghalint が一律に要求するため置く。
# 冒頭の permissions は書き忘れたジョブの下限として残す（他のワークフローも同じ方針）。
#
# timeout-minutes の値は実行時間を計測して決めたものではなく、通常の実行に対して余裕を取った上限（未計測）。
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    permissions:
      contents: read

    container:
      # 接尾辞なしの版は 2026.10.0 から scratch になり、runner が tail で起動できず失敗する（#26）ため -debian 版を使う。
      # https://github.com/jdx/mise/pull/13413
      #
      # -debian 版には Node.js が入っていないため、markdownlint-cli2 が要る Node.js は mise.toml で入れる。
      # Renovate は最初のハイフン以降を互換性の指標として扱うため、-debian の付いたタグだけを更新先にする。
      # https://docs.renovatebot.com/modules/versioning/docker/
      #
      # mise の版は同梱の aqua レジストリの新しさも決め、古いと新しいツールが "no asset found" で入らない（2026.8.10 で実測）。
      image: ghcr.io/jdx/mise:2026.10.1-debian@sha256:3daa20e31600afa0b4182736b1d46ba87d47dccb41db55880e657d4290f47574

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # root のコンテナから runner 所有の workspace を扱うと git が dubious ownership で拒否し、ls-files 頼みの検査が黙って変わる。
      # checkout の set-safe-directory は後続ステップに残らない。https://github.com/actions/checkout/issues/766
      - name: workspaceをgitのsafe.directoryに登録
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # 検査の前提（git が使えること）を明示的に確かめる。safe.directory の登録が外れると、
      # 黙って対象が変わるのではなくこのステップが dubious ownership で落ちる。
      - name: gitがworkspaceを扱えることを確認
        run: git ls-files --error-unmatch .editorconfig

      # mise exec を毎回書かずに手元と同じコマンドで実行できるよう、各ツールの bin を PATH に通す。
      - name: 検査ツールを導入
        id: tools
        run: |
          mise install
          mise bin-paths >> "$GITHUB_PATH"

      # 以降の検査は互いに独立しているため、前の検査が落ちても残りを実行して指摘をまとめて出す。
      # ツールの導入自体に失敗したときは、後続を動かしても command not found が並ぶだけなので動かさない。
      #
      # *.bash / *.bats も対象に含める（-x は source 先を読むだけで、そのファイル自体は検査しない）。
      # -o all で有効にする optional チェック: https://github.com/koalaman/shellcheck/wiki/Optional
      - name: シェルスクリプトを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          git ls-files -z '*.sh' '*.bash' '*.bats' |
            xargs -0 --no-run-if-empty shellcheck -o all -x

      # -d は差分を出して終了コード1で落ちる。整形の指定は .editorconfig にあり、整形フラグを1つでも渡すと
      # .editorconfig が読まれなくなるため渡さない。https://github.com/mvdan/sh/blob/master/cmd/shfmt/shfmt.1.scd
      - name: シェルスクリプトの整形を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '*.sh' '*.bash' '*.bats' | xargs -0 --no-run-if-empty shfmt -d

      # 上の shellcheck は *.sh 等、actionlint は .github/workflows だけが対象で、action.yml の run: は漏れるため別に検査する。
      - name: composite actionのrunを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: .github/scripts/check-action-shell.sh

      - name: JSONの構文を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '*.json' | xargs -0 --no-run-if-empty -n1 jq empty

      # 構文が壊れていれば整形できないため、fmt --check で構文と整形を兼ねて検査する。
      # https://taplo.tamasfe.dev/cli/usage/formatting.html
      - name: TOMLを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '*.toml' | xargs -0 --no-run-if-empty taplo fmt --check --diff

      # --strict が無いと warning だけなら終了コード0で通る（cli.py の return_code。v1.38.0 で実測）。
      #
      # trailing-spaces と new-line-at-end-of-file は editorconfig-checker とも重複するが、
      # key-duplicates と anchors の検査は yamllint にしか無いため残している。
      - name: YAMLの構文を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 --no-run-if-empty yamllint -c .github/ci.yamllint.yml --strict

      # actionlint は式の型・needs・permissions・run: の中身など yamllint の届かない層を見る（shellcheck は PATH 上のもの）。
      # https://github.com/rhysd/actionlint/blob/main/docs/checks.md
      #
      # 検査対象（.github/workflows）は引数なしで自動的に見つかる。設定ファイルだけ -config-file で渡す
      # （ランナーラベルの検査に要る。設定の中身の理由と、自動検出させない理由はそのファイル）。
      - name: ワークフローを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: actionlint -color -config-file .github/ci.actionlint.yaml

      # ghalint は permissions・timeout・persist-credentials・SHA 固定の方針を強制する。対象は引数なしで見つかる。
      # https://github.com/suzuki-shunsuke/ghalint#policies
      - name: ワークフローのセキュリティ方針を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ghalint run

      - name: action.ymlのセキュリティ方針を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ghalint run-action

      # zizmor は式インジェクションやキャッシュ汚染など攻撃の筋道を見る（他の2ツールとの違いは mise.toml）。
      # https://docs.zizmor.sh/audits/
      #
      # GH_TOKEN が無いと online audits が警告1行で素通りする（1.30.1 で実測）。公開リポジトリの参照なので read で足りる。
      # https://docs.zizmor.sh/usage/#operating-modes
      #
      # INPUTS は必須のため . を渡し、ワークフローと composite action を .gitignore を尊重して集めさせる。
      #
      # persona は最も厳しい auditor。偽陽性と excessive-permissions の扱いは .github/ci.zizmor.yml で個別に外す。
      # https://docs.zizmor.sh/usage/#using-personas
      #
      # --strict-collection が無いと壊れたファイルは黙って対象から外れ成功する（1.30.1 で実測）。
      # actionlint も同じ誤りを捉えるが、スキーマ解釈のずれに備えて残す。
      - name: ワークフローのセキュリティを静的解析
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/ci.zizmor.yml --persona auditor --strict-collection --color never --no-progress .

      # name と required_status_checks がずれても両ファイルは単体で正しく CI も緑のままなので、ここで突き合わせる。
      # ruleset-drift.yml は定義ファイルと GitHub 上の設定の比較で、別物。
      - name: 必須チェックの名前とジョブ名の一致を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: .github/scripts/check-required-checks.sh

      # hadolint は内蔵の shellcheck で RUN も見る（PATH 上の shellcheck には依存しない）。
      # https://github.com/hadolint/hadolint/blob/master/README.md
      #
      # hadolint はファイル名で判別せず渡したものを Dockerfile として読むため、対象は find のパターンで決まる。
      #
      # --failure-threshold style は、最も低い severity である style の指摘でも失敗させる。
      # 既定は info で、style の指摘だけでは落ちない（v2.15.1 で実測）。
      - name: Dockerfileを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          find . -path ./.git -prune -o -type f \
            \( -name Dockerfile -o -name 'Dockerfile.*' -o -name '*.Dockerfile' \) -print0 |
            xargs -0 --no-run-if-empty hadolint --no-color --failure-threshold style

      # 対象はリポジトリ直下から見た git 管理下（および未追跡・非 ignore）のテキストファイル全て。
      # YAML 以外のファイルにも文字コード・改行・インデント幅・末尾空白・最終改行の検査を広げる。
      - name: .editorconfigへの準拠を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: editorconfig-checker -no-color -format github-actions

      # typos は誤綴りの辞書と突き合わせ未知語を指摘しないため、必須チェックにしても誤検知が出にくい。
      # https://github.com/crate-ci/typos/blob/master/docs/design.md
      #
      # 引数なしだと .github/ が隠しディレクトリとして外れ、--hidden では .git/ 内を誤検出するため git ls-files で渡す（v1.50.2 で実測）。
      #
      # 綴り以外の理由で指摘される語が出たら、_typos.toml で除外する。
      # https://github.com/crate-ci/typos/blob/master/docs/reference.md
      - name: 綴りを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files | typos --file-list - --color never --sort

      # markdownlint は見出しの飛びやテーブルの列数など、Markdown 固有の書式を見る。
      # https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
      #
      # 対象もルールも設定ファイルの globs で決まるためファイルは渡さない（自動検出させない理由はそのファイル）。
      - name: Markdownを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: markdownlint-cli2 --config .github/ci.markdownlint-cli2.yaml

      # 外部URLは必須にするとマージが外部要因で止まるため link-check.yml が日次で見る。
      # ここでは --offline でリポジトリ内のファイル参照だけを PR 時点で検査する。
      - name: ローカルファイルへのリンク切れを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: lychee --offline --config .github/ci.lychee.toml --no-progress .

      # betterleaks はプッシュ保護の提携パターン外の資格情報も検出し、必須チェックで止める（使い分けは mise.toml）。
      # https://github.com/betterleaks/betterleaks#configuration
      #
      # --redact は公開ログに秘密を書き写さないため必須。--verbose が無いと検出箇所が出ない（v1.8.1 で実測）。
      #
      # 履歴の検査（betterleaks git .）は checkout が fetch-depth: 1 のため CI では使わない。
      #
      # 誤検知は対象直下に .betterleaks.toml を置いて除外する（--config 無しで読まれる。--help の order of precedence）。
      - name: 秘密情報を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: betterleaks dir . --no-color --redact --verbose

      # ロックファイル・マニフェストの依存を OSV と突き合わせる（mise.toml と uses: は対象外。詳細は mise.toml）。
      #
      # --allow-no-lockfiles は付けない。api/go.mod が対象になる（v2.6.0 で実測）ので不要で、付けないことで
      # 対象を消したり読めない形式にしたときに、0件成功ではなく終了コード 128 で気づける。
      # https://google.github.io/osv-scanner/output/
      #
      # -r が無いと引数直下しか見ず、下層のロックファイルが黙って外れる（v2.6.0 で実測）。
      #
      # この検査だけは依存のパッケージ名と版を deps.dev・osv.dev に送る。避けるなら --offline-vulnerabilities。
      - name: 依存関係の脆弱性を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: osv-scanner scan source -r .

  # main に残る件名は PR タイトルになる（squash のみ・件名は PR_TITLE）ため、タイトルを CLAUDE.md の規約で検査する。
  #
  # 対象が PR のメタデータで mise のツールも使わないため、lint のコンテナ起動とツール導入を待たない独立ジョブにする。
  #
  # push（main）では PR が無くタイトルも取れないため、pull_request のときだけ動かす。
  # 必須チェックが評価されるのは PR に対してなので、これで足りる。
  pr-title:
    name: PR title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # タイトルは env 経由でスクリプトに渡す。run: に ${{ }} を直接書くと、タイトルに仕込んだ文字列が
      # そのままシェルとして解釈されうる（zizmor の template-injection / CodeQL の actions/code-injection）。
      #
      # Renovate の :configMigration が作る PR のタイトルが日本語になるかは未確認。英語なら落ちるので手で直す。
      - name: PRのタイトルを検査
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-pr-title.sh "$PR_TITLE"

  # renovate.json5 は JSON5 のため jq の対象外。validator は引数なしで既定の設定場所を自動検出する。
  # https://docs.renovatebot.com/config-validation/
  # https://docs.renovatebot.com/configuration-options/
  #
  # validator は mise のレジストリに無いため Renovate 本体のイメージで動かす（版は Renovate が追う）。
  # 非 root（uid 12021）では workspace に checkout が書き込めない恐れがあるため root で動かす（未検証）。
  # https://github.com/renovatebot/renovate/blob/main/tools/docker/Dockerfile
  renovate-config:
    name: Renovate config
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      contents: read

    container:
      # editorconfig-checker-disable-next-line
      image: ghcr.io/renovatebot/renovate:44.132.2@sha256:0191afbc3937e5316263426fc0ce1450f5c143d42e3f91da8c6f771e317fae51
      options: --user root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Renovateの設定を検査
        run: renovate-config-validator --strict

  scripts-test:
    name: Scripts test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      contents: read

    container:
      image: ghcr.io/jdx/mise:2026.10.1-debian@sha256:3daa20e31600afa0b4182736b1d46ba87d47dccb41db55880e657d4290f47574

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # テストが実物を使う jq・yq・shellcheck と bats だけを入れる（gh はスタブ。scripts/test/helper.bash 参照）。
      # curl・diff・sha256sum はイメージ同梱のものを使う。
      - name: batsと検査に使うツールを導入
        run: |
          mise install aqua:bats-core/bats-core aqua:jqlang/jq aqua:mikefarah/yq aqua:koalaman/shellcheck
          mise bin-paths >> "$GITHUB_PATH"

      - name: シェルスクリプトをテスト
        # 共通ヘルパ（scripts/lib/bats-helpers.bash）は各テストが load で読むため、ここには並べない。
        run: bats scripts/test .github/scripts/test .github/actions/*/test

  # Go は devcontainer と同じ golang イメージを同じ digest で使い、手元と版を揃える。
  # mise に入れると lint でも Go が入り遅くなる。
  #
  # go コマンドは git を呼ばないため safe.directory は登録しない。
  # go build を足すなら登録か -buildvcs=false が要る（1.27.1 で実測）。
  #
  # 各検査は互いに独立しているため、lint ジョブと同じく前の検査が落ちても残りを実行する。
  go-test:
    name: Go test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      contents: read

    container:
      # editorconfig-checker-disable-next-line
      image: golang:1.27.1-trixie@sha256:3b77fc618ec235a1ab412de7737f120dd507c57e8d87de4cbb7994fb94275ed5

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # -l は終了コード0のままで CI が落ちないため -d を使う（1.27.1 で実測）。
      # gofumpt はイメージに無く、検査は gofmt の範囲。
      - name: 整形を検査
        run: gofmt -d .

      # go.mod / go.sum が import と食い違っていれば差分を出して終了コード 1 になる（1.27.1 で実測）。
      # 書き換えはしない。
      - name: go.modの整合を検査
        if: ${{ !cancelled() }}
        run: go mod tidy -diff

      - name: 静的解析
        if: ${{ !cancelled() }}
        run: go vet ./...

      # -race はデータ競合を検出する。cgo と C コンパイラが要るが、golang の Debian ベースのイメージには gcc が入っている。
      - name: テスト
        if: ${{ !cancelled() }}
        run: go test -race ./...
