---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 全ジョブに name を置く。zizmor の pedantic な検査（anonymous-definition）が、名前の無い定義を
# 「読み手に何のジョブか伝わらない」として指摘するため。
#
# name を置くとステータスチェックの名前はジョブIDではなくその name になる
# （zizmorcore/zizmor の CI で、job_id lint / name Lint のジョブが API 上 "Lint" として
# 返ることを実測）。.github/rulesets/main.json の required_status_checks の context は
# こちらに合わせる（Lint / Scripts test / Renovate config）。
# name を変えるときは ruleset も同時に直して scripts/apply-repo-settings.sh を再実行しないと、
# 要求された名前のチェックが永久に現れずマージできなくなる。
#
# 検査ツールは mise でまとめて導入する。版は mise.toml に固定してあり、手元でも同じ版を再現できる
# （導入手段を mise に寄せた理由はそのファイルのコメント）。
# 以前はツールごとに公式 Docker イメージをジョブのコンテナにしていたためジョブが分かれていたが、
# 全ツールが同じコンテナで動くようになったので lint ジョブ1つにまとめている。
# どの検査が落ちたかはステップ単位で分かる。
#
# scripts-test を lint の needs にぶら下げず、独立した必須チェックにしている。
# needs の依存先が失敗してスキップされたジョブは required check としてマージを止めない場合があるため。
# editorconfig-checker-disable-next-line
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
#
# サードパーティのアクションは使わない。リポジトリ設定で実行可能なアクションを GitHub 公式と
# 検証済みに限っているため（scripts/apply-repo-settings.sh の selected-actions）。
#
# 各ジョブに permissions と timeout-minutes を置き、checkout には persist-credentials: false を渡す。
# ワークフロー冒頭にも permissions があって冗長に見えるが、ghalint のポリシー（job_permissions /
# job_timeout_minutes_is_required / checkout_persist_credentials_should_be_false）が全ジョブに一律で
# 要求するため、例外を作らずに揃えている。冒頭の permissions は、新しいジョブが書き忘れたときの下限として残す。
# この方針は他のワークフロー（link-check / renovate / *-drift）にも同じく適用している。
#
# timeout-minutes の値は実行時間を計測して決めたものではなく、通常の実行に対して余裕を取った上限（未計測）。
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    permissions:
      contents: read

    container:
      # mise の公式イメージ。rust（debian ベース）から作られていて linux/amd64 と linux/arm64 の両方を持つため、
      # arm ランナーで動く（ghcr.io の manifest を取得して実測）。検査に要る git・bash・find のほか、
      # markdownlint-cli2 が要る Node.js も同梱している（イメージのビルド時に mise use -g node@lts している）。
      # USER 指定が無く root で動くため --user root は要らない。
      # ENTRYPOINT は mise 自身だが、runner はジョブのコンテナを --entrypoint tail で起動するため上書きは要らない。
      # https://github.com/jdx/mise/blob/main/packaging/mise/Dockerfile
      #
      # mise の版は、同梱する aqua レジストリのスナップショットの新しさも決める。古い mise だと新しいツールの
      # アセット名を解決できず導入に失敗することがある（2026.8.10 では editorconfig-checker 4.0.1 が
      # "no asset found" で落ち、2026.9.9 では入ることを手元で実測）。
      image: ghcr.io/jdx/mise:2026.9.10@sha256:e6263d300a50e3a28f1a3cef3969ab171d4dfa5f3bccdf868ae53c8dbf41685f

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # コンテナは root（uid 0）で動くが、workspace はホストの runner ユーザー（uid 1001）の所有。
      # そのままでは git が dubious ownership で拒否し、検査対象の一覧（git ls-files）が作れない。
      # editorconfig-checker は git ls-files の失敗をエラーにせず黙ってディレクトリ走査へフォールバックする
      # （#3 の診断ステップで実測）。
      # actions/checkout の set-safe-directory は一時的な HOME にしか書かれず、後続ステップには残らない。
      # https://github.com/actions/checkout/issues/766
      - name: workspaceをgitのsafe.directoryに登録
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # 検査の前提（git が使えること）を明示的に確かめる。safe.directory の登録が外れると、
      # 黙って対象が変わるのではなくこのステップが dubious ownership で落ちる。
      - name: gitがworkspaceを扱えることを確認
        run: git ls-files --error-unmatch .editorconfig

      # mise.toml に書いた全ツールを導入し、それぞれの bin ディレクトリを後続ステップの PATH に通す。
      # mise exec を毎回書かずに済み、手元で実行するコマンドとステップの内容が揃う。
      - name: 検査ツールを導入
        id: tools
        run: |
          mise install
          mise bin-paths >> "$GITHUB_PATH"

      # 以降の検査は互いに独立しているため、前の検査が落ちても残りを実行して指摘をまとめて出す。
      # ツールの導入自体に失敗したときは、後続を動かしても command not found が並ぶだけなので動かさない。
      # -o all は既定で無効になっている optional チェックを全て有効にする（require-variable-braces、
      # quote-safe-variables、require-double-brackets、deprecate-which など11件。--list-optional で一覧が出る）。
      # severity の既定は style（最も低い＝全て出る）なので -S は要らない。
      # https://github.com/koalaman/shellcheck/wiki/Optional
      #
      # -x は source した先のファイルも読む。既定ではコマンドラインで渡したファイルしか追わないため、
      # scripts/lib/bats-helpers.bash のような共通ヘルパで定義された変数・関数を把握できない。
      # このリポジトリには source / load で他のファイルを読むスクリプトが7つある。
      #
      # 対象は *.sh だけでなく *.bash（bats の共通ヘルパ）と *.bats（テスト本体）も含める。
      # -x で source 先を読めても、読み込み先のファイル自体が検査対象になるわけではないため。
      # *.bats は shebang が #!/usr/bin/env bats で shellcheck が方言を判別できないので、
      # 各ファイルの先頭に # shellcheck shell=bash を置いている。
      - name: シェルスクリプトを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          git ls-files -z '*.sh' '*.bash' '*.bats' |
            xargs -0 --no-run-if-empty shellcheck -o all -x

      - name: JSONの構文を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '*.json' | xargs -0 --no-run-if-empty -n1 jq empty

      # 検査内容は .github/ci.yamllint.yml に置いている（default プリセット＋ line-length の上限と
      # truthy の調整。それぞれの理由と、リポジトリ直下ではなく .github/ に置いている理由は
      # そのファイルのコメント）。自動検出は実行ディレクトリとその親しか見ずこの場所には届かないため、
      # markdownlint の --config と同じく -c で明示的に渡す。
      #
      # --strict は warning レベルの指摘も終了コード2にする。これが無いと、yamllint は error が
      # 無ければ warning がいくつ出ても終了コード0で成功する（cli.py の return_code。v1.38.0 で実測）。
      # 以前の -d relaxed には --strict も付いておらず、80文字超の警告が37件出たまま CI は通っていた。
      #
      # trailing-spaces と new-line-at-end-of-file は editorconfig-checker とも重複するが、
      # key-duplicates と anchors の検査は yamllint にしか無いため残している。
      - name: YAMLの構文を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 --no-run-if-empty yamllint -c .github/ci.yamllint.yml --strict

      # actionlint は GitHub Actions のワークフロー専用の検査で、yamllint では届かない層を見る。
      # 式の型（steps.<id> の参照ミス、関数の引数の数）、ローカルアクションに渡す with: のキー名と必須入力、
      # permissions のスコープ名、needs の依存先、run: スクリプトの中身などが対象。
      # run: の中身の検査には PATH 上の shellcheck を使うため、上のステップと同じ版で検査される。
      # https://github.com/rhysd/actionlint/blob/main/docs/checks.md
      #
      # 引数なしで .github/workflows を自動で見つける。
      # ランナーラベルの検査には .github/actionlint.yaml の設定が要る（理由はそのファイル）。
      - name: ワークフローを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: actionlint -color

      # ghalint はワークフローと action.yml をセキュリティ方針の観点で検査する。actionlint が構文・式・run: の
      # 中身を見るのに対し、こちらは「全ジョブに permissions と timeout-minutes があるか」「checkout の
      # persist-credentials が false か」「アクションの ref がフルの commit SHA か」といった方針を強制する。
      # run が .github/workflows/*.y?ml を、run-action が3階層までの action.y?ml を引数なしで見つける。
      # https://github.com/suzuki-shunsuke/ghalint#policies
      - name: ワークフローのセキュリティ方針を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ghalint run

      - name: action.ymlのセキュリティ方針を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ghalint run-action

      # zizmor は GitHub Actions をセキュリティの観点で静的解析する。actionlint が構文・式・run: の中身を、
      # ghalint が permissions や timeout の方針を見るのに対し、こちらは攻撃の筋道そのものを見る
      # （式インジェクション、$GITHUB_ENV 経由の任意コード実行、キャッシュ汚染、なりすましコミットなど）。
      # 3ツールの守備範囲の違いは mise.toml のコメント。
      # https://docs.zizmor.sh/audits/
      #
      # GH_TOKEN を渡すと online audits（known-vulnerable-actions や impostor-commit など、GitHub API に
      # 問い合わせる検査）も動く。渡さない場合 zizmor は警告を1行出すだけでオフラインモードで続行し、
      # 終了コードは変わらないためこれらが素通りする（1.30.1 で実測）。
      # トークンの用途は API のレート制限の解除で、参照先は公開リポジトリのため、
      # ジョブの contents: read のまま追加の権限は要らない。
      # https://docs.zizmor.sh/usage/#operating-modes
      #
      # 対象は INPUTS が必須引数のため明示的に渡す。リポジトリ全体を渡すと、ワークフローと
      # composite action の両方が .gitignore を尊重しつつ集められる。
      # 検査内容の調整は .github/zizmor.yml に置いている（self-repository を無効にしている理由もそこ）。
      #
      # persona は auditor を使う。regular（既定）→ pedantic → auditor の順に厳しく、pedantic は
      # permissions に説明コメントが無い（undocumented-permissions）、ジョブに name が無い
      # （anonymous-definition）といった「脆弱性そのものではないが読み手に前提が伝わらない書き方」を、
      # auditor はさらに「偽陽性になりそうなものも含め zizmor が検出できる全て」を出す。
      # 偽陽性が出たら .github/zizmor.yml の ignore で個別に外す。
      # https://docs.zizmor.sh/usage/#personas
      # excessive-permissions 自体は regular でも有効な検査だが、「ワークフロー冒頭の write 権限を
      # 全ジョブが上書きしている」という形の指摘だけは pedantic でしか出ず、これがこのリポジトリの方針と
      # 衝突するため .github/zizmor.yml で対象を絞っている（regular では出ないことを 1.30.1 で実測）。
      # 終了コードは、指摘が無ければ 0、指摘があれば最も重い severity に応じて 11〜14 になる
      # （informational=11 / low=12 / medium=13 / high=14）。
      # https://docs.zizmor.sh/usage/
      #
      # --strict-collection は、収集した入力に構文・スキーマの誤りがあったとき、警告して読み飛ばすのではなく
      # 失敗にする。既定だと壊れたファイルは検査対象から黙って外れ、警告1行を残したまま
      # 「No findings to report」と表示して成功する（steps が配列でないワークフローを置いて 1.30.1 で実測）。
      # 検査対象が黙って減るより落ちるほうを選ぶ方針は、上の「gitがworkspaceを扱えることを確認」と同じ。
      #
      # 同じ誤りは actionlint も syntax-check で捉えるため実害は小さい（同じファイルで実測）。
      # ただし yamllint は YAML として妥当なら通すので（同上）、この層を実際に担っているのは actionlint だけ。
      # 両者のスキーマ解釈がずれて zizmor だけが読めないファイルが出る可能性は残るため、こちらでも取りこぼさない。
      - name: ワークフローのセキュリティを静的解析
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona auditor --strict-collection --color never --no-progress .

      # hadolint は Dockerfile 専用の検査。命令の書き方（タグの固定、apt のバージョン指定、不要なレイヤなど）に加え、
      # shellcheck を内蔵していて RUN の中身も見る（PATH 上の shellcheck には依存しない）。
      # https://github.com/hadolint/hadolint/blob/master/README.md
      #
      # 他の検査と違い git ls-files ではなく find で集めている。hadolint はファイル名では対象を判別せず、
      # 引数で渡したファイルをそのまま Dockerfile として読むため、対象の決定はこの find のパターンが全て。
      # Dockerfile をまだ置いていない間は xargs が hadolint を起動しないため、この検査は何もせず成功する。
      #
      # --failure-threshold style は、最も低い severity である style の指摘でも失敗させる。
      # 既定は info で、style の指摘だけでは落ちない（v2.15.1 で実測）。
      - name: Dockerfileを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          find . -path ./.git -prune -o -type f \
            \( -name Dockerfile -o -name 'Dockerfile.*' -o -name '*.Dockerfile' \) -print0 |
            xargs -0 --no-run-if-empty hadolint --no-color --failure-threshold style

      # 対象はリポジトリ直下から見た git 管理下（および未追跡・非 ignore）のテキストファイル全て。
      # YAML 以外のファイルにも文字コード・改行・インデント幅・末尾空白・最終改行の検査を広げる。
      - name: .editorconfigへの準拠を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: editorconfig-checker -no-color -format github-actions

      # typos はソースコード向けの綴り検査。識別子を単語に分解して「誤り → 正しい綴り」の辞書と突き合わせる方式で、
      # 辞書に無い語を未知語として指摘しないため、一般的なスペルチェッカと違って PR で回しても誤検知が出にくい。
      # https://github.com/crate-ci/typos/blob/master/docs/design.md
      #
      # 検査対象は他の検査と同じく git 管理下のファイル。typos は既定で隠しディレクトリを飛ばすため、
      # 引数なしだと .github/ 以下が丸ごと対象から外れる。--hidden で解禁すると今度は .git/ 内の
      # 圧縮オブジェクトをバイナリとして読んで誤検出する（v1.50.2 で実測）。
      #
      # 綴り以外の理由で指摘される語が出たら、_typos.toml で除外する。
      # https://github.com/crate-ci/typos/blob/master/docs/reference.md
      #
      # 終了コードは指摘があれば 2 になる（v1.50.2 で実測）。--sort は結果の出力順を固定する（--help の "Sort results"）。
      - name: 綴りを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files | typos --file-list - --color never --sort

      # markdownlint は Markdown 専用の書式検査。見出しレベルの飛び（MD001）、コードブロックの言語指定（MD040）、
      # テーブルの列数の不一致（MD055/MD056）など、editorconfig-checker が見る文字コード・空白の層や
      # lychee が見るリンクの到達性では届かないところを検査する。
      # https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
      #
      # 検査対象もルールも .github/ci.markdownlint-cli2.yaml に置いている。設定ファイルの自動検出は
      # 実行ディレクトリとその親しか見ないため、--config で明示的に渡す。渡した設定ファイルの globs も
      # 検査対象に足される（ファイル名に ci. を付けている理由も含め、根拠はそのファイルのコメント）。
      # 終了コードは指摘があれば 1、実行時の失敗なら 2。
      # https://github.com/DavidAnson/markdownlint-cli2#exit-codes
      - name: Markdownを検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: markdownlint-cli2 --config .github/ci.markdownlint-cli2.yaml

      # betterleaks は秘密情報の検査。GitHub のシークレットスキャンとプッシュ保護
      # （scripts/apply-repo-settings.sh で有効化）が提携プロバイダのトークンを push の時点で弾くのに対し、
      # こちらは提携パターン以外の資格情報も既定ルールで検出し、必須チェックとしてマージを止める。
      # 版を固定している理由と GitHub 側の検査との使い分けは mise.toml のコメント。
      # https://github.com/betterleaks/betterleaks#configuration
      #
      # --verbose を付けないと「leaks found: N」としか出ず、どのファイルの何行目かが分からない（v1.8.1 で実測）。
      # --redact は検出した文字列を REDACTED に置き換える。パブリックリポジトリでは実行ログも公開されるため、
      # 本物の秘密が漏れたときにログへ二重に書き写さないよう必ず付ける。
      # バナー（--no-banner で消せる3行）は実行した版がログに残るので消さない。
      # 終了コードは検出が無ければ 0、あれば 1（--exit-code の既定値。v1.8.1 で実測）。
      #
      # 対象はリポジトリ直下。.git の中身は走査しないが、他の検査と違って git 管理下かどうかは見ず、
      # .gitignore の対象や隠しディレクトリの中まで検査する（v1.8.1 で実測）。
      # checkout 直後の CI では追跡対象しか無いため差は出ないが、手元で実行すると対象が増える。
      # 履歴を遡る検査は別コマンド（betterleaks git .）で、checkout が既定の fetch-depth: 1 のためここでは使わない。
      # 必要になったら手元で実行する。
      #
      # 誤検知が出たら .betterleaks.toml を置いて除外する（--config を渡さない場合、対象パス直下の
      # .betterleaks.toml が読まれる。betterleaks --help の order of precedence）。
      # 導入時点ではこのリポジトリに検出は無い（dir . と git . のどちらも "no leaks found" を手元で実測）。
      - name: 秘密情報を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: betterleaks dir . --no-color --redact --verbose

      # osv-scanner は依存関係の既知の脆弱性の検査。他の検査が書き方や秘密情報を見るのに対し、
      # こちらはロックファイルから依存を取り出して OSV データベースと突き合わせる。
      # 何を対象にし何を対象にしないか（mise.toml と GitHub Actions の uses: は対象外）は mise.toml のコメント。
      #
      # このリポジトリには現時点で対応ロックファイルが1つも無いため、このステップは常に0件で通る。
      # --allow-no-lockfiles が無いと「対象が見つからない」ことが失敗として扱われ、終了コード 128 で落ちる
      # （v2.6.0 で実測。付ければ "No issues found" で 0 になることも実測）。
      # 依存を持つコードを置いたらこのフラグは外してよい。外すと、ロックファイルを消してしまったり
      # osv-scanner が読めない形式に変えてしまったときに、0件成功ではなく失敗として気づける。
      # 終了コードは、脆弱性が無ければ 0、あれば 1、実行時のエラーは 127、対象が無ければ 128。
      # https://google.github.io/osv-scanner/output/
      #
      # -r はサブディレクトリまで走査する。付けないと引数のディレクトリ直下しか見ず、
      # 下に置いたロックファイルが黙って対象から外れる（v2.6.0 で実測）。
      # 対象の集め方はディレクトリ走査だが .gitignore は尊重する（同上）。
      # git ls-files で対象を決める他の検査とも、.gitignore を無視する betterleaks とも違うが、
      # checkout 直後の CI では結果は変わらない。
      #
      # この検査だけは外部のサービスに問い合わせる。取り出した依存のパッケージ名とバージョンが
      # deps.dev（--data-source の既定値）と osv.dev に送られる。リポジトリの中身そのものは送らない。
      # 送信を避けたい場合は --offline-vulnerabilities でローカルの DB に切り替えられる。
      - name: 依存関係の脆弱性を検査
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: osv-scanner scan source -r --allow-no-lockfiles .

  # .github/renovate.json5 はコメントを書けるよう JSON5 にしており、lint ジョブの jq 検査の対象外。
  # Renovate 同梱の validator で、スキーマとプリセット参照の妥当性まで検査する。
  # https://docs.renovatebot.com/config-validation/
  # 引数なしで実行すると、Renovate がリポジトリ設定として認める既定の場所（.github/renovate.json5 を含む）を
  # 自動検出する。
  # https://docs.renovatebot.com/configuration-options/
  # renovate 本体を実行するわけではないので、リポジトリへの書き込み権限やトークンは要らない。
  #
  # このジョブだけ mise を使わない。renovate-config-validator は mise のレジストリに無いため
  # （mise registry で確認）、Renovate 本体の Docker イメージをジョブのコンテナにして validator の版も
  # Renovate 自身に更新させる。
  # イメージは非 root（uid 12021）で動く設定だが、runner はコンテナ起動時にユーザーを指定せず、
  # ホスト側の runner ユーザーが所有する workspace へ checkout が書き込めない恐れがあるため root で動かす。
  # https://github.com/renovatebot/renovate/blob/main/tools/docker/Dockerfile
  renovate-config:
    name: Renovate config
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      contents: read

    container:
      # editorconfig-checker-disable-next-line
      image: ghcr.io/renovatebot/renovate:44.95.0@sha256:33fd5ccb592fd10226c057c656e2a9aaa3d5c4fb84a616d2cbc2b426ba347ec1
      options: --user root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Renovateの設定を検査
        run: renovate-config-validator --strict

  scripts-test:
    name: Scripts test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      contents: read

    container:
      image: ghcr.io/jdx/mise:2026.9.10@sha256:e6263d300a50e3a28f1a3cef3969ab171d4dfa5f3bccdf868ae53c8dbf41685f

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # このジョブで要るのは bats と jq だけなので、mise.toml の全ツールではなくこの2つだけを入れる。
      # テストは外部へ出る gh を PATH の先頭に置いたスタブへ差し替える一方、jq は実物を使う
      # （scripts/test/helper.bash）。curl・diff・sha256sum はイメージ同梱のものを使う。
      - name: batsとjqを導入
        run: |
          mise install aqua:bats-core/bats-core aqua:jqlang/jq
          mise bin-paths >> "$GITHUB_PATH"

      - name: シェルスクリプトをテスト
        # composite action のテストは各 action の test/ にある。
        # 共通ヘルパ（scripts/lib/bats-helpers.bash）は各 test/helper.bash が load で読むため、ここには並べない
        run: bats scripts/test .github/actions/*/test
